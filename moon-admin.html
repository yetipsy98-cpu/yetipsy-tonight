<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YÉ TIPSY Moon Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0806;color:#eee5d3;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.wrap{max-width:920px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{color:#ddb76c}.card{background:#14100c;border:1px solid #40331f;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select{width:100%;padding:11px;border:1px solid #4a3a25;border-radius:10px;background:#090806;color:#fff}button{border:0;border-radius:10px;padding:11px 14px;background:#d6aa58;color:#171009;font-weight:800;cursor:pointer}.secondary{background:#2a2319;color:#ddc997}.danger{background:#6c302b;color:#fff}.reward{display:grid;grid-template-columns:1.8fr .7fr .7fr .6fr;gap:8px;align-items:center;margin:8px 0}.claim{display:grid;grid-template-columns:1fr 1fr 1.2fr .8fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #2d251a;font-size:12px}.muted{font-size:11px;color:#8f836e}.login{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:min(100%,380px)}@media(max-width:650px){.reward{grid-template-columns:1fr 70px 80px}.reward .enabled{grid-column:1/-1}.claim{grid-template-columns:1fr 1fr}.claim .actions{grid-column:1/-1}}
</style></head><body><div class="wrap"><div class="top"><div><h1>🌕 月满杯盈 Admin</h1><div class="muted">活动控制 · 奖励概率 · 领取记录</div></div><button class="secondary" onclick="load()">刷新</button></div>
<div class="card"><h3>活动设置</h3><div class="grid"><label>活动状态<select id="enabled"><option value="true">开放</option><option value="false">关闭</option></select></label><label>员工解锁密码<input id="staffPass" placeholder="留空=不修改"></label><label>授权有效分钟<input id="ttl" type="number" min="1" max="30"></label><label>Admin 新密码<input id="adminPass" placeholder="留空=不修改"></label></div><p><button onclick="saveConfig()">保存活动设置</button></p></div>
<div class="card"><h3>奖励与概率</h3><p class="muted">启用中的奖励概率合计必须 = 100%。顾客页会注明活动结果以系统设定概率为准。</p><div id="rewards"></div><div>当前合计：<b id="total">0%</b></div><p><button onclick="saveRewards()">保存奖励设置</button></p></div>
<div class="card"><h3>最近领取记录</h3><input id="search" placeholder="搜索 WhatsApp / 找回码 / 奖励" oninput="renderClaims()"><div id="claims"></div></div></div>
<div class="login" id="login"><div class="card"><h2>Admin 登录</h2><input id="pass" type="password" placeholder="Admin 密码"><p><button onclick="loginNow()">登录</button></p><div class="muted" id="loginErr"></div></div></div>
<script>
const API_URL="PASTE_EXISTING_MINIGAME_WEB_APP_URL_HERE";let adminToken="",state={rewards:[],claims:[]};
async function api(subaction,data={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:"moon",subaction,adminToken},data))});return JSON.parse(await r.text())}
async function loginNow(){const d=await api("adminLogin",{password:pass.value});if(!d.ok){loginErr.textContent="密码错误";return}adminToken=d.adminToken;login.style.display="none";load()}
async function load(){const d=await api("adminState");if(!d.ok){login.style.display="flex";return}state=d;enabled.value=String(d.config.activityEnabled);ttl.value=d.config.tokenTtl;renderRewards();renderClaims()}
function renderRewards(){rewards.innerHTML=state.rewards.map((r,i)=>`<div class="reward"><input data-i="${i}" data-k="name" value="${r.name}"><input data-i="${i}" data-k="displayOnes" type="number" min="0" max="5" value="${r.displayOnes}"><input data-i="${i}" data-k="probability" type="number" step=".01" min="0" max="100" value="${r.probability}" oninput="sum()"><label class="enabled"><input data-i="${i}" data-k="enabled" type="checkbox" ${r.enabled?"checked":""}> 开启</label></div>`).join("");sum()}
function sum(){let t=0;document.querySelectorAll('[data-k="probability"]').forEach((x)=>{const i=+x.dataset.i;if(document.querySelector(`[data-i="${i}"][data-k="enabled"]`).checked)t+=+x.value||0});total.textContent=t.toFixed(2)+"%";total.style.color=Math.abs(t-100)<.001?"#9bd18b":"#e58a75"}
async function saveConfig(){const d=await api("adminSaveConfig",{activityEnabled:enabled.value==="true",staffPassword:staffPass.value,adminPassword:adminPass.value,tokenTtl:+ttl.value});alert(d.ok?"已保存":"保存失败："+d.error);staffPass.value="";adminPass.value=""}
async function saveRewards(){document.querySelectorAll("#rewards input").forEach(x=>{const r=state.rewards[+x.dataset.i],k=x.dataset.k;r[k]=k==="enabled"?x.checked:(k==="probability"||k==="displayOnes"?+x.value:x.value)});const d=await api("adminSaveRewards",{rewards:state.rewards});alert(d.ok?"奖励设置已保存":"保存失败："+d.error+(d.total!=null?"（当前 "+d.total+"%）":""));if(d.ok)load()}
function renderClaims(){const q=(search.value||"").toLowerCase();const arr=(state.claims||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));claims.innerHTML=arr.map(x=>`<div class="claim"><div><b>${x.code}</b><br><span class="muted">${new Date(x.created).toLocaleString()}</span></div><div>${x.phone}</div><div>${x.reward}<br><span class="muted">骰子 ${x.dice}</span></div><div>${x.redeemed==="YES"?"已兑换":x.status}</div><div class="actions"><button onclick="mark('${x.code}','SENT')">已发送</button> <button class="secondary" onclick="mark('${x.code}','REDEEMED')">已兑换</button></div></div>`).join("")||'<p class="muted">暂无记录</p>'}
async function mark(code,status){const d=await api("adminUpdateClaim",{code,status});if(!d.ok)alert("更新失败："+d.error);else load()}
</script></body></html>
