<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YÉ TIPSY · Moon Admin V15.5</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090806;color:#f2ead9;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.brand,h2,h3{color:#dfb867}.sub,.muted{font-size:12px;color:#95866d}.card{background:#14100c;border:1px solid #493a25;border-radius:18px;padding:18px;margin:15px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#0c0a07;border:1px solid #3e3222;border-radius:15px;padding:15px}.metric b{font-size:28px;color:#e3bc6c;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}input,select{width:100%;padding:12px;background:#090806;border:1px solid #4b3a25;border-radius:10px;color:#fff}button{border:0;border-radius:10px;padding:11px 14px;background:#d9ae5c;color:#171009;font-weight:800}.secondary{background:#30271b;color:#e5d4b4}.reward{display:grid;grid-template-columns:2fr .65fr .75fr .65fr;gap:8px;margin:8px 0}.claim{display:grid;grid-template-columns:1.1fr 1fr 1.4fr .8fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #2d251a;font-size:12px}.barrow{display:grid;grid-template-columns:150px 1fr 45px;gap:8px;align-items:center;margin:9px 0}.bar{height:10px;background:#2b241a;border-radius:99px;overflow:hidden}.fill{height:100%;background:#d9ae5c}.login{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.login .card{width:min(390px,100%)}.ok{color:#9fd58e}.bad{color:#e58d79}@media(max-width:650px){.claim{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}.reward{grid-template-columns:1fr 65px 78px}.barrow{grid-template-columns:105px 1fr 35px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1 class="brand">YÉ TIPSY · MOON ADMIN</h1><div class="sub">月满杯盈 · 实时活动控制台</div></div><button class="secondary" onclick="loadState()">刷新</button></div>
<div class="card"><h3>实时概览</h3><div class="metrics">
<div class="metric"><span>当前在线</span><b id="mOnline">0</b><small>近 2 分钟活跃</small></div>
<div class="metric"><span>今日送出</span><b id="mToday">0</b></div>
<div class="metric"><span>累计送出</span><b id="mTotal">0</b></div>
<div class="metric"><span>今日核销</span><b id="mTodayRedeem">0</b></div>
<div class="metric"><span>累计核销</span><b id="mRedeem">0</b></div>
<div class="metric"><span>待发送</span><b id="mPending">0</b></div>
</div><p class="muted">后台每 30 秒自动刷新。在线人数为匿名浏览器活跃数，不读取顾客 WhatsApp。</p></div>
<div class="card"><h3>送出奖励分布</h3><div id="rewardStats"></div></div>
<div class="card"><h3>最近 14 天送出趋势</h3><div id="dailyStats"></div></div>
<div class="card"><h3>活动设置</h3><div class="grid"><label>活动状态<select id="enabled"><option value="true">开放</option><option value="false">关闭</option></select></label><label>二维码有效分钟<input id="ttl" type="number"></label><label>员工登入天数<input id="staffDays" type="number"></label><label>Admin 新密码<input id="adminPass" placeholder="留空不修改"></label></div><p><button onclick="saveConfig()">保存设置</button></p></div>
<div class="card"><h3>奖励与概率</h3><div id="rewards"></div><p>当前合计：<b id="total">0%</b></p><button onclick="saveRewards()">保存奖励设置</button></div>
<div class="card"><h3>最近领取记录</h3><input id="search" placeholder="搜索 WhatsApp / 找回码 / REF / 奖励" oninput="renderClaims()"><div id="claims"></div></div></div>
<div class="login" id="login"><div class="card"><h2>Admin 登录</h2><input id="pass" type="password" placeholder="Admin 密码"><p><button onclick="loginNow()">进入后台</button></p><div id="loginErr" class="bad"></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzCFtnhDubjakfhj3fbdDKa7hUZ0eJV6GCfc62TqQkwWETfTkvcglbip1sYxcuI4hqlNg/exec";let adminToken="",state={rewards:[],claims:[],stats:{}};
async function api(a,d={}){try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"moon",subaction:a,adminToken,...d})});return JSON.parse(await r.text())}catch(e){return{ok:false,error:"network_error"}}}
async function loginNow(){const d=await api("adminLogin",{password:pass.value});if(!d.ok){loginErr.textContent="登录失败："+d.error;return}adminToken=d.adminToken;login.style.display="none";loadState()}
async function loadState(){const d=await api("adminState");if(!d.ok){if(d.error==="admin_auth")login.style.display="flex";return}state=d;enabled.value=String(d.config.activityEnabled);ttl.value=d.config.gameTtl||20;staffDays.value=d.config.staffDays||30;renderDashboard();renderRewards();renderClaims()}
function renderDashboard(){const s=state.stats||{};mOnline.textContent=state.online||0;mToday.textContent=s.todayClaims||0;mTotal.textContent=s.totalClaims||0;mTodayRedeem.textContent=s.todayRedeemed||0;mRedeem.textContent=s.totalRedeemed||0;mPending.textContent=s.pending||0;const rr=s.rewards||{},max=Math.max(1,...Object.values(rr));rewardStats.innerHTML=Object.entries(rr).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`).join("")||'<p class="muted">暂无数据</p>';const dd=s.daily||[],dm=Math.max(1,...dd.map(x=>x.count));dailyStats.innerHTML=dd.map(x=>`<div class="barrow"><span>${esc(x.date)}</span><div class="bar"><div class="fill" style="width:${x.count/dm*100}%"></div></div><b>${x.count}</b></div>`).join("")||'<p class="muted">暂无数据</p>'}
function renderRewards(){rewards.innerHTML=state.rewards.map((r,i)=>`<div class="reward"><input data-i="${i}" data-k="name" value="${esc(r.name)}"><input data-i="${i}" data-k="displayOnes" type="number" min="0" max="5" value="${r.displayOnes}"><input data-i="${i}" data-k="probability" type="number" step=".01" value="${r.probability}" oninput="sumProb()"><label><input data-i="${i}" data-k="enabled" type="checkbox" ${r.enabled?"checked":""}> 开启</label></div>`).join("");sumProb()}
function sumProb(){let t=0;document.querySelectorAll('[data-k="probability"]').forEach(x=>{const c=document.querySelector(`[data-i="${x.dataset.i}"][data-k="enabled"]`);if(c&&c.checked)t+=+x.value||0});total.textContent=t.toFixed(2)+"%"}
async function saveConfig(){const d=await api("adminSaveConfig",{activityEnabled:enabled.value==="true",adminPassword:adminPass.value,gameTtl:+ttl.value||20,staffDays:+staffDays.value||30});if(!d.ok)return alert("保存失败："+d.error);adminPass.value="";alert("已保存")}
async function saveRewards(){document.querySelectorAll("#rewards input").forEach(x=>{const r=state.rewards[+x.dataset.i],k=x.dataset.k;r[k]=k==="enabled"?x.checked:(k==="probability"||k==="displayOnes"?+x.value:x.value)});const d=await api("adminSaveRewards",{rewards:state.rewards});if(!d.ok)return alert("保存失败："+d.error);loadState()}
function renderClaims(){const q=(search.value||"").toLowerCase(),arr=(state.claims||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));claims.innerHTML=arr.map(x=>`<div class="claim"><div><b>${esc(String(x.code))}</b><br><span class="muted">${fmt(x.created)}${x.redeemRef?`<br>REF ${esc(String(x.redeemRef))}`:""}</span></div><div>${esc(String(x.phone))}</div><div>${esc(String(x.reward))}</div><div>${x.redeemed==="YES"?"已兑换":esc(String(x.status))}</div><div class="actions"><button onclick="markClaim('${attr(String(x.code))}','SENT')">已发送</button><button class="secondary" onclick="markClaim('${attr(String(x.code))}','REDEEMED')">已兑换</button></div></div>`).join("")||'<p class="muted">暂无记录</p>'}
async function markClaim(c,s){const d=await api("adminUpdateClaim",{code:c,status:s});if(!d.ok)alert("更新失败："+d.error);else loadState()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function attr(s){return s.replace(/'/g,"\\\\'")}function fmt(v){try{return new Date(v).toLocaleString()}catch(e){return String(v)}}
setInterval(()=>{if(adminToken)loadState()},30000);
</script></body></html>
