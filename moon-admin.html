<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YÉ TIPSY · Moon Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090806;color:#f2ead9;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.brand{color:#dfb867;letter-spacing:.12em}.sub{font-size:12px;color:#8f836d}.card{background:#14100c;border:1px solid #493a25;border-radius:18px;padding:18px;margin:15px 0}h1,h2,h3{color:#dfb867}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}input,select{width:100%;padding:12px;background:#090806;border:1px solid #4b3a25;border-radius:10px;color:#fff}button{border:0;border-radius:10px;padding:11px 14px;background:#d9ae5c;color:#171009;font-weight:800;cursor:pointer}.secondary{background:#30271b;color:#e5d4b4}.reward{display:grid;grid-template-columns:2fr .65fr .75fr .65fr;gap:8px;margin:8px 0;align-items:center}.claim{display:grid;grid-template-columns:1.1fr 1fr 1.4fr .8fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #2d251a;align-items:center;font-size:12px}.muted{font-size:11px;color:#8f836d}.login{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.login .card{width:min(390px,100%)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.ok{color:#9fd58e}.bad{color:#e58d79}@media(max-width:650px){.reward{grid-template-columns:1fr 65px 78px}.reward .enabled{grid-column:1/-1}.claim{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}
</style>
</head>
<body>
<div style="max-width:980px;margin:12px auto;padding:12px 16px;border:1px solid #5b472d;border-radius:14px;color:#d8bd82;background:#120f0b">
<b>中奖概率设置</b><br>
概率只在员工授权时读取并锁定本局结果；顾客按「摇月亮」时不会再连接后台，因此不会拖慢揭晓动画。所有启用奖项概率合计必须为 100%。
</div>
<div class="wrap">
<div class="top"><div><h1 class="brand">YÉ TIPSY · MOON ADMIN</h1><div class="sub">月满杯盈 · 活动控制台</div></div><button class="secondary" onclick="loadState()">刷新</button></div>

<div class="card">
<h3>活动设置</h3>
<div class="grid">
<label>活动状态<select id="enabled"><option value="true">开放</option><option value="false">关闭</option></select></label>
<label>服务员账号<input id="staffUser" placeholder="staff"></label>
<label>服务员登入新密码<input id="staffPass" placeholder="留空 = 不修改"></label>
<label>二维码有效分钟<input id="ttl" type="number" min="2" max="60"></label>
<label>服务员登入小时<input id="staffHours" type="number" min="1" max="24"></label>
<label>Admin 新密码<input id="adminPass" placeholder="留空 = 不修改"></label>
</div>
<p><button onclick="saveConfig()">保存活动设置</button></p>
</div>

<div class="card">
<h3>奖励与概率</h3>
<div class="muted">启用中的奖励概率合计必须等于 100%。显示「1」数量决定顾客看到的骰面。</div>
<div id="rewards"></div>
<p>当前合计：<b id="total">0%</b></p>
<button onclick="saveRewards()">保存奖励设置</button>
</div>

<div class="card">
<h3>最近领取记录</h3>
<input id="search" placeholder="搜索 WhatsApp / 找回码 / 奖励" oninput="renderClaims()">
<div id="claims"></div>
</div>
</div>

<div class="login" id="login">
<div class="card">
<h2>Admin 登录</h2>
<p class="muted">第一次默认密码：CHANGE-ADMIN</p>
<input id="pass" type="password" placeholder="Admin 密码">
<p><button onclick="loginNow()">进入后台</button></p>
<div id="loginErr" class="bad"></div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzCFtnhDubjakfhj3fbdDKa7hUZ0eJV6GCfc62TqQkwWETfTkvcglbip1sYxcuI4hqlNg/exec";
let adminToken="",state={rewards:[],claims:[]};

async function api(action,data={}){
  try{
    const r=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({action:"moon",subaction:action,adminToken},data))
    });
    return JSON.parse(await r.text());
  }catch(e){
    return {ok:false,error:"network_error"};
  }
}
async function loginNow(){
  loginErr.textContent="";
  const d=await api("adminLogin",{password:pass.value});
  if(!d.ok){loginErr.textContent="登录失败："+d.error;return}
  adminToken=d.adminToken;
  login.style.display="none";
  await loadState();
}
async function loadState(){
  const d=await api("adminState");
  if(!d.ok){
    if(d.error==="admin_auth")login.style.display="flex";
    else alert("读取失败："+d.error);
    return;
  }
  state=d;
  enabled.value=String(d.config.activityEnabled);
  staffUser.value=d.config.staffUsername||"staff";
  ttl.value=d.config.gameTtl||10;
  staffHours.value=d.config.staffHours||12;
  renderRewards();
  renderClaims();
}
function renderRewards(){
  rewards.innerHTML=state.rewards.map((r,i)=>`
  <div class="reward">
    <input data-i="${i}" data-k="name" value="${escapeHtml(r.name)}">
    <input title="显示1数量" data-i="${i}" data-k="displayOnes" type="number" min="0" max="5" value="${r.displayOnes}">
    <input title="概率%" data-i="${i}" data-k="probability" type="number" step=".01" min="0" max="100" value="${r.probability}" oninput="sumProb()">
    <label class="enabled"><input data-i="${i}" data-k="enabled" type="checkbox" ${r.enabled?"checked":""}> 开启</label>
  </div>`).join("");
  sumProb();
}
function sumProb(){
  let t=0;
  document.querySelectorAll('[data-k="probability"]').forEach(x=>{
    const i=+x.dataset.i;
    const c=document.querySelector(`[data-i="${i}"][data-k="enabled"]`);
    if(c&&c.checked)t+=Number(x.value)||0;
  });
  total.textContent=t.toFixed(2)+"%";
  total.className=Math.abs(t-100)<.001?"ok":"bad";
}
async function saveConfig(){
  const d=await api("adminSaveConfig",{
    activityEnabled:enabled.value==="true",
    staffUsername:staffUser.value,
    staffPassword:staffPass.value,
    adminPassword:adminPass.value,
    gameTtl:Number(ttl.value)||10,
    staffHours:Number(staffHours.value)||12
  });
  if(!d.ok){alert("保存失败："+d.error);return}
  staffPass.value="";adminPass.value="";
  alert("已保存");
}
async function saveRewards(){
  document.querySelectorAll("#rewards input").forEach(x=>{
    const r=state.rewards[+x.dataset.i],k=x.dataset.k;
    r[k]=k==="enabled"?x.checked:
      (k==="probability"||k==="displayOnes"?Number(x.value):x.value);
  });
  const d=await api("adminSaveRewards",{rewards:state.rewards});
  if(!d.ok){
    alert("保存失败："+d.error+(d.total!=null?"；当前合计 "+d.total+"%":""));
    return;
  }
  alert("奖励设置已保存");
  loadState();
}
function renderClaims(){
  const q=(search.value||"").toLowerCase();
  const arr=(state.claims||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  claims.innerHTML=arr.map(x=>`
  <div class="claim">
    <div><b>${escapeHtml(String(x.code))}</b><br><span class="muted">${formatDate(x.created)}</span></div>
    <div>${escapeHtml(String(x.phone))}</div>
    <div>${escapeHtml(String(x.reward))}<br><span class="muted">骰子 ${escapeHtml(String(x.dice))}</span></div>
    <div>${x.redeemed==="YES"?"已兑换":escapeHtml(String(x.status))}</div>
    <div class="actions">
      <button onclick="markClaim('${escapeAttr(String(x.code))}','SENT')">已发送</button>
      <button class="secondary" onclick="markClaim('${escapeAttr(String(x.code))}','REDEEMED')">已兑换</button>
    </div>
  </div>`).join("")||'<p class="muted">暂无记录</p>';
}
async function markClaim(code,status){
  const d=await api("adminUpdateClaim",{code,status});
  if(!d.ok)alert("更新失败："+d.error);
  else loadState();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s){return s.replace(/'/g,"\\'")}
function formatDate(v){try{return new Date(v).toLocaleString()}catch(e){return String(v)}}
</script>
</body>
</html>
