<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASE FILES · 数字解密档案馆</title><style>
:root{--bg:#080e13;--panel:#141f27;--line:#344651;--txt:#e7edef;--soft:#9eb1b9;--gold:#d5ad6b;--good:#9dbba7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% 0%,#20303c 0%,#0a1116 55%,#080d11);color:var(--txt);font-family:system-ui,'Noto Sans SC',sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.brand{color:var(--gold);font:600 11px ui-monospace,monospace;letter-spacing:.2em}.shell{max-width:1200px;margin:auto;padding:19px 16px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.top h1{font-size:23px;letter-spacing:.01em;margin:6px 0 0}.muted{color:var(--soft)}.lead{font-size:13px;line-height:1.85;color:#a9bbc3}.btn{border:1px solid var(--line);border-radius:9px;background:#24323b;color:var(--txt);padding:11px 14px;white-space:nowrap}.btn:active{transform:scale(.98)}.btn.gold{background:var(--gold);color:#111d22;font-weight:800;border-color:var(--gold)}.btn.outline{background:transparent}.btn.small{padding:8px 10px;font-size:12px}.panel{border:1px solid var(--line);background:linear-gradient(140deg,#15212a,#0e181e);border-radius:15px;padding:19px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;background:#17232b;padding:18px;min-height:180px;cursor:pointer;transition:.2s}.card:hover{border-color:var(--gold)}.card h3{margin:30px 0 10px}.card .eyebrow{font:10px ui-monospace,monospace;letter-spacing:.2em;color:var(--gold)}.buttons{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:8px;margin:12px 0}.field span{font-size:12px;color:#a7bcc6}input,select{padding:13px;border-radius:9px;background:#0a151d;border:1px solid #485c67;color:var(--txt);width:100%;outline:none}input:focus,select:focus{border-color:var(--gold)}.center{max-width:520px;margin:8vh auto}.roomcode{font:800 36px ui-monospace,monospace;letter-spacing:.17em;color:#e2c38f;text-align:center;margin:15px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{color:#b9c6c7;border:1px solid #63737a;border-radius:40px;padding:5px 9px;font-size:10px;letter-spacing:.1em}.divider{height:1px;background:#33424a;margin:18px 0}.work{display:grid;grid-template-columns:240px minmax(0,1fr);gap:15px}.nav{border:1px solid var(--line);border-radius:13px;background:#111b22;padding:9px;height:max-content}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#b9c4c9;border-radius:7px;padding:12px 9px;margin:2px 0}.nav button.active{background:#2c3941;color:#f9e0b5}.view{min-width:0}.scene{overflow:hidden;background:#0c141a;border-radius:12px;border:1px solid #43525c;position:relative;min-height:290px}.scene img,.scene video{width:100%;display:block;max-height:520px;object-fit:cover;background:#070c10}.scene img{min-height:280px}.scene .placeholder{height:330px;background:linear-gradient(120deg,#17252f,#243541 43%,#0c151b 44%,#1d2934 70%,#0e1720);position:relative}.scene .placeholder:after{content:'CAMERA / 现场记录';position:absolute;left:20px;bottom:20px;color:#b0b9bc;font:12px ui-monospace,monospace;letter-spacing:.18em}.scene-label{position:absolute;left:12px;top:11px;background:#081219c4;border:1px solid #698087;padding:7px 10px;font:11px ui-monospace,monospace;color:#d3e3e6;pointer-events:none}.hotspot{position:absolute;width:29px;height:29px;border:1px solid #f0d9a9;background:#cda56e40;transform:translate(-50%,-50%);border-radius:50%;animation:pulse 2.8s infinite}.hotspot:after{content:'';position:absolute;inset:7px;background:#edcf97;border-radius:50%}@keyframes pulse{50%{box-shadow:0 0 0 12px #d4b18012}}.cctvcontrols{background:#101b22;padding:12px;border-top:1px solid #334651;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.cctvcontrols button{padding:8px;background:#283945;border:1px solid #405462;color:#dce6e8;border-radius:5px}.timeline{width:100%;accent-color:#d4b17b}.mono{font-family:ui-monospace,Consolas,monospace}.case-sheet{background:#111c23;border:1px solid #3d4b54;border-radius:11px;padding:14px;margin:12px 0}.case-sheet h3{margin:0 0 8px;font-size:15px}.case-sheet p{line-height:1.8;font-size:13px;color:#b7c9d0}.image-small{max-width:100%;max-height:290px;object-fit:contain;display:block;border-radius:7px;margin:12px auto}.terminal{background:#07120e;border:1px solid #315c4b;color:#92bf9c;font:13px ui-monospace,monospace;line-height:1.6;padding:20px;border-radius:6px}.terminal input{color:#9bdbaf;background:#06140c;border-color:#365747;font-family:ui-monospace,monospace}.phone{max-width:320px;border:7px solid #273039;border-radius:35px;background:#0d171f;padding:18px;margin:0 auto;box-shadow:0 15px 30px #0008}.phone .statusbar{text-align:center;padding:10px 0;color:#c6bba8;font-size:11px}.phone .display{background:#19272f;min-height:180px;border-radius:16px;padding:16px;line-height:1.8}.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.clue{padding:15px;border:1px solid #42505a;border-radius:9px;background:#16232b;cursor:pointer;text-align:left;color:var(--txt)}.clue.active{border-color:var(--gold)}.clue small{font:10px ui-monospace,monospace;color:#cfb58a}.modal{position:fixed;z-index:50;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px}.dialog{width:min(580px,100%);max-height:92vh;overflow:auto;border:1px solid #60727c;border-radius:16px;background:#182630;padding:20px}.dialog img,.dialog video{width:100%;max-height:340px;object-fit:contain}.intro{position:fixed;inset:0;z-index:35;background:radial-gradient(circle at 50% 30%,#2a3941,#070c12 75%);padding:40px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.intro h2{font:600 clamp(24px,6vw,38px) Georgia,serif;line-height:1.3;color:#e7c78c}.intro p{max-width:550px;line-height:2.1;color:#bacdd6;white-space:pre-wrap}.intro img,.intro video{max-height:40vh;max-width:100%;margin:14px auto;object-fit:contain}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;max-width:90%;padding:13px 18px;background:#293a43;border:1px solid #caaa76;border-radius:8px;box-shadow:0 10px 30px #0008}.reportChoice{display:grid;grid-template-columns:1fr;gap:10px}.reportChoice label{border:1px solid #405460;padding:12px;border-radius:8px;display:flex;gap:8px}.reportChoice input{width:18px}.notice{font-size:12px;color:#b0bfc6;line-height:1.8}.bottomnav{display:none}@media(max-width:760px){.shell{padding:13px 11px 95px}.work{grid-template-columns:1fr}.nav{position:sticky;top:0;z-index:15;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;padding:6px;scrollbar-width:none}.nav button{width:auto;flex:0 0 auto;font-size:12px;padding:10px 12px}.top h1{font-size:18px}.top .buttons{flex-wrap:nowrap}.panel{padding:13px}.scene{min-height:220px}.scene img{min-height:230px;max-height:390px}.scene .placeholder{height:260px}.buttons .btn{white-space:normal}.intro{padding:24px 16px}.intro h2{font-size:26px}.intro p{font-size:14px}.roomcode{font-size:30px}} 
</style></head><body><div id="landing" class="shell"><header class="top"><div><div class="brand">YETIPSY PARTY / DIGITAL MYSTERY</div><h1>案件档案馆</h1></div><button class="btn small" id="joinbtn">加入房间</button></header><div class="panel"><div class="brand">INVESTIGATION ARCHIVE</div><h2>每一宗案件，都有它自己的真相。</h2><p class="lead">选择案件，邀请朋友，一起检查现场、交换资料、破解机关。每人看到的调查权限可以不同。无需下载应用。</p></div><div id="catalog" class="cards"></div><p class="notice">管理员可前往 <a href="./index.html">案件工作室</a> 编辑和发布新案件。</p></div><div id="lobby" class="shell hidden"></div><div id="game" class="shell hidden"></div><div id="opening" class="intro hidden"></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const ENDPOINT='https://hlsjzwqqrojjxrcngcbt.supabase.co/functions/v1/party-case-studio';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':"'" }[c]||'&#39;'));
let token=sessionStorage.getItem('case-player-session')||'',state=null,slug=new URLSearchParams(location.search).get('case'),screen='board',selected=[],modalClue=null,openingIndex=0,poller=null,lastSignature='',busy=false,caseList=[];
const introSeen=(code)=>sessionStorage.getItem('intro:'+code)==='1';
async function api(op,data={}){const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op,token,...data})});let v=await r.json().catch(()=>({error:'NETWORK_ERROR'}));if(!r.ok||v.error)throw Error(v.error||'UNKNOWN_ERROR');return v}
function message(s,err=false){let d=$('#toast');d.textContent=s;d.style.borderColor=err?'#d48380':'#cfa66d';d.classList.remove('hidden');clearTimeout(message.t);message.t=setTimeout(()=>d.classList.add('hidden'),3500)}
function show(area){for(const a of ['landing','lobby','game'])$('#'+a).classList.toggle('hidden',area!==a)}
const sceneList=()=>state?.case?.scenes||[], clues=()=>state?.case?.clues||[], puzzles=()=>state?.case?.puzzles||[];
const collected=id=>(state?.events||[]).some(x=>x.kind==='clue'&&x.item_id===id);
const solved=id=>(state?.events||[]).some(x=>x.kind==='puzzle'&&x.item_id===id);
const proven=id=>(state?.events||[]).some(x=>x.kind==='proof'&&x.item_id===id);
function url(path){return state?.media?.[path]||''}
function mediaBlock(path,cls='image-small'){const u=url(path),ext=(path||'').split('.').pop().toLowerCase();if(!u)return '';if(['mp4','webm'].includes(ext))return '<video class="'+cls+'" controls playsinline preload="metadata" src="'+esc(u)+'"></video>';if(['mp3','wav','ogg','m4a'].includes(ext))return '<audio controls src="'+esc(u)+'"></audio>';return '<img class="'+cls+'" src="'+esc(u)+'" alt="现场素材">'}
function previewCatalog(){if(!caseList.length){$('#catalog').innerHTML='<div class="panel"><h3>案件档案尚未开放</h3><p class="muted">管理员可进入案件工作室创建并发布第一宗自定义案件。</p></div>';return}
 $('#catalog').innerHTML=caseList.map(c=>'<div class="card" data-start="'+esc(c.slug)+'"><div class="eyebrow">CASE / '+esc(c.slug.toUpperCase())+'</div><h3>'+esc(c.title)+'</h3><p class="muted">'+esc(c.subtitle||'待调查档案')+'</p><p class="notice">'+esc(c.minPlayers)+'–'+esc(c.maxPlayers)+' 人 · 约 '+esc(c.duration)+' 分钟</p><button class="btn gold small" data-start="'+esc(c.slug)+'">建立调查房间</button></div>').join('')}
async function loadCatalog(){try{const v=await api('catalog');caseList=v.cases;previewCatalog()}catch(e){message('案件列表读取失败：'+e.message,true)}}
function newRoomDialog(sl){slug=sl;$('#modal').innerHTML='<div class="dialog"><h2>建立调查房间</h2><p class="muted">请使用自己的昵称。邀请朋友面对面加入同一场案件。</p><label class="field"><span>你的昵称</span><input id="name" maxlength="24" placeholder="输入昵称" autocomplete="off"></label><div class="buttons"><button class="btn gold" id="confirmCreate">建立房间</button><button class="btn" id="cancelDialog">返回</button></div></div>';$('#modal').classList.remove('hidden');$('#confirmCreate').onclick=async()=>{try{let v=await api('create_room',{slug,name:$('#name').value.trim()});setSession(v.token);$('#modal').classList.add('hidden');await poll(true)}catch(e){message(e.message,true)}};$('#cancelDialog').onclick=()=>$('#modal').classList.add('hidden')}
function joinDialog(code=''){$('#modal').innerHTML='<div class="dialog"><h2>加入调查小组</h2><p class="muted">填写同伴分享的六位房间码。</p><label class="field"><span>房间码</span><input id="joincode" maxlength="6" value="'+esc(code)+'" autocomplete="off" class="mono" style="text-transform:uppercase"></label><label class="field"><span>昵称</span><input id="joinname" maxlength="24" placeholder="输入昵称"></label><div class="buttons"><button class="btn gold" id="confirmJoin">加入房间</button><button class="btn" id="cancelDialog">返回</button></div></div>';$('#modal').classList.remove('hidden');$('#confirmJoin').onclick=async()=>{try{let v=await api('join_room',{code:$('#joincode').value.toUpperCase(),name:$('#joinname').value});setSession(v.token);$('#modal').classList.add('hidden');await poll(true)}catch(e){message(e.message,true)}};$('#cancelDialog').onclick=()=>$('#modal').classList.add('hidden')}
function setSession(t){token=t;sessionStorage.setItem('case-player-session',t);lastSignature='';}
function roomView(){show('lobby');$('#lobby').innerHTML='<header class="top"><div><div class="brand">INVESTIGATION GROUP</div><h1>调查组集结</h1></div><button class="btn small" id="leave">离开</button></header><div class="panel center" style="margin-top:20px"><p class="muted" style="text-align:center">请让同伴在自己的手机上输入房间码</p><div class="roomcode">'+esc(state.room.code)+'</div><div class="cards">'+state.players.map(p=>'<div class="case-sheet"><div class="brand">SEAT '+String(p.seat+1).padStart(2,'0')+'</div><h3>'+esc(p.nickname)+(p.id===state.me.id?' · 你':'')+'</h3></div>').join('')+'</div><div class="divider"></div><div class="buttons"><button class="btn" id="share">复制房间邀请码</button>'+(state.me.host?'<button class="btn gold" id="start">开始案件</button>':'<p class="muted">等待房主开局…</p>')+'</div><p class="notice">游戏开始后，每个人会得到自己的调查权限；资料可以共享，但原始操作需要各自完成。</p></div>';$('#leave').onclick=leave;$('#share').onclick=async()=>{const s='案件调查邀请码：'+state.room.code+'\\n'+location.origin+location.pathname+'?join='+state.room.code;try{await navigator.clipboard.writeText(s);message('邀请码已复制')}catch{message('房间码：'+state.room.code)}};if(state.me.host)$('#start').onclick=async()=>{try{busy=true;state=await api('start',{withMedia:true});await postState()}catch(e){message(e.message,true)}finally{busy=false}}}
function escapeRoom(){return !!state&&state.room.status!=='lobby'}
function startOpening(){const key=state.room.code;if(introSeen(key))return;openingIndex=0;drawOpening()}
function drawOpening(){const slides=state.case.intro||[];if(!slides.length){finishOpening();return}
 $('#opening').classList.remove('hidden');let v=slides[openingIndex];$('#opening').innerHTML='<div class="brand">CASE FILE · '+esc(state.room.code)+' / FILE '+String(openingIndex+1).padStart(2,'0')+'</div><h2>'+esc(v.title||'案情简报')+'</h2>'+mediaBlock(v.mediaPath)+'<p>'+esc(v.text||'')+'</p><div class="buttons" style="justify-content:center"><button class="btn gold" id="nextIntro">'+(openingIndex===slides.length-1?'进入现场 →':'继续阅读 →')+'</button></div><p class="muted" style="font-size:11px">'+(openingIndex+1)+' / '+slides.length+'</p>';$('#nextIntro').onclick=()=>{if(++openingIndex>=slides.length)finishOpening();else drawOpening()}}
function finishOpening(){sessionStorage.setItem('intro:'+state.room.code,'1');$('#opening').classList.add('hidden');renderGame(true)}
function leave(){if(!confirm('退出后会离开当前页面。本次房间的调查资料不会删除，重新打开需要保留同一浏览器会话。'))return;sessionStorage.removeItem('case-player-session');token='';state=null;clearInterval(poller);location.href=location.pathname}
function gameNav(){const roleScenes=sceneList();return '<button data-screen="board" class="'+(screen==='board'?'active':'')+'">调查案卷</button>'+roleScenes.map(s=>'<button data-screen="'+esc(s.id)+'" class="'+(screen===s.id?'active':'')+'">'+esc(s.title)+'</button>').join('')+'<button data-screen="report" class="'+(screen==='report'?'active':'')+'">结案报告</button>'}
function renderGame(full=false){show('game');const d=state.case;if(full){$('#game').innerHTML='<header class="top"><div><div class="brand">CASE '+esc(state.room.code)+' / '+esc(d.title)+'</div><h1>现场调查</h1></div><div class="buttons"><button class="btn small" id="replay">重看前情</button><button class="btn small" id="leavegame">离开</button></div></header><div class="work"><nav class="nav" id="worknav"></nav><main class="view" id="workview"></main></div>';$('#leavegame').onclick=leave;$('#replay').onclick=()=>{openingIndex=0;drawOpening()}}
 $('#worknav').innerHTML=gameNav();if(screen!=='board'&&screen!=='report'&&!find(sceneList(),screen))screen='board';
 if(state.room.status==='finished'){screen='ending';$('#workview').innerHTML=endingView();return}
 $('#workview').innerHTML=screen==='board'?boardView():screen==='report'?reportView():sceneView(find(sceneList(),screen));
 wireScene();
}
function find(a,id){return (a||[]).find(x=>x.id===id)}
function sceneView(s){if(!s)return '<div class="panel">当前工作台尚未开放</div>';const d=state.case,puzzlesHere=puzzles().filter(p=>p.sceneId===s.id),cluesHere=clues().filter(c=>c.sceneId===s.id);
 const med=s.mediaPath,asset=url(med),video=/\.(mp4|webm)$/i.test(med||'');
 const picture=asset?(video?'<video id="scene-video" playsinline preload="metadata" src="'+esc(asset)+'" controls></video>':'<img src="'+esc(asset)+'" alt="场景现场">'):'<div class="placeholder"></div>';
 const hotspots=cluesHere.filter(x=>!collected(x.id)).map(c=>'<button class="hotspot" style="left:'+Math.max(1,Math.min(99,Number(c.hotspotX)||50))+'%;top:'+Math.max(1,Math.min(99,Number(c.hotspotY)||50))+'%" data-clue="'+esc(c.id)+'" aria-label="调查此处"></button>').join('');
 const inner=(s.type==='phone'?'<div class="phone"><div class="statusbar mono">00:17 | 无服务</div><div class="display">'+esc(s.body||'')+'</div>'+picture+'</div>':s.type==='terminal'?'<div class="terminal">&gt; SECURE CONSOLE<br>&gt; '+esc(s.body||'')+'</div>'+picture:picture);
 return '<div class="panel"><div class="flex"><div><div class="brand">'+esc(s.type.toUpperCase())+' / '+esc(s.id)+'</div><h2>'+esc(s.title)+'</h2></div><span class="pill">私人调查权限</span></div><p class="lead">'+esc(s.body||'')+'</p><div class="scene">'+inner+'<div class="scene-label">现场记录 / '+esc(s.title)+'</div>'+hotspots+'</div>'+(s.type==='cctv'?'<div class="cctvcontrols"><button data-cctv="-5">◀ 5 秒</button><button data-cctv="pause">暂停 / 播放</button><button data-cctv="5">5 秒 ▶</button><button data-cctv="speed">速度 1×</button><button data-cctv="zoom">放大画面</button><input id="timeline" type="range" min="0" max="100" value="0" class="timeline"><span id="timecode" class="mono">00:00</span></div>':'')+'<p class="notice">点击画面中的可疑位置检查资料。现场不保证每份材料都与案件真相有关。</p></div>'+puzzlesHere.map(p=>puzzleView(p)).join('')+'</div>'}
function puzzleView(p){const done=solved(p.id),choices=(p.choices||[]);return '<div class="panel"><div class="brand">SECURITY / '+esc(p.type.toUpperCase())+'</div><h3>'+esc(p.title)+'</h3><p class="lead">'+esc(p.prompt||'')+'</p>'+(done?'<div class="pill">访问已解除</div>':'<div class="buttons" style="align-items:flex-end">'+(p.type==='choice'?'<select data-puzzle-input="'+esc(p.id)+'">'+choices.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.label)+'</option>').join('')+'</select>':'<input data-puzzle-input="'+esc(p.id)+'" placeholder="'+(p.type==='order'?'按顺序输入，例如 A-B-C-D':p.type==='pin'?'输入密码':'输入指令')+'" autocomplete="off" style="flex:1;min-width:160px">')+'<button class="btn gold" data-solve="'+esc(p.id)+'">确认操作</button></div>')+'</div>'}
function boardView(){let e=(state.events||[]).filter(x=>x.kind==='clue'),claims=e.map(x=>find(clues(),x.item_id)).filter(Boolean);let pairs=(state.events||[]).filter(x=>x.kind==='proof');return '<div class="panel"><div class="brand">INQUIRY DOSSIER</div><h2>调查案卷</h2><p class="lead">原始资料并不等于有效证明。只有相互核对、能解释同一事实的记录，才能成为结案依据。</p><div class="evidence">'+(claims.length?claims.map(c=>'<button class="clue" data-clue="'+esc(c.id)+'"><small>原始资料</small><h3>'+esc(c.title)+'</h3><span class="muted">查看内容</span></button>').join(''):'<div class="case-sheet"><p>现场记录尚未送达。</p></div>')+'</div><div class="divider"></div><div class="brand">CROSS REFERENCE</div><h3>交叉核对</h3><p class="notice">任意选取两份材料尝试建立关联。无法确认的组合不会自动成为证据。</p><div class="buttons"><select id="pair-a"><option value="">第一份材料</option>'+claims.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.title)+'</option>').join('')+'</select><select id="pair-b"><option value="">第二份材料</option>'+claims.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.title)+'</option>').join('')+'</select><button class="btn" id="compare">核对资料</button></div>'+(pairs.length?'<div class="divider"></div><h3>核实的关联</h3>'+pairs.map(x=>{let p=find(state.case.proofs,x.item_id);return p?'<div class="case-sheet"><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'')+'</p></div>':''}).join(''):'')+'</div>'}
function reportView(){const rs=state.case.report||[],already=state.events.some(e=>e.kind==='vote'&&e.item_id===state.me.id);return '<div class="panel"><div class="brand">CASE REPORT</div><h2>结案报告</h2><p class="lead">所有调查员需要根据已核实的资料确认结论，而不是凭猜测提交。</p>'+(rs.length?'<div id="reportform">'+rs.map((r,i)=>'<div class="case-sheet"><h3>'+esc(r.label)+'</h3><div class="reportChoice">'+(r.choices||[]).map(c=>'<label><input type="radio" name="r-'+esc(r.id)+'" value="'+esc(c.id)+'"><span>'+esc(c.label)+'</span></label>').join('')+'</div></div>').join('')+'</div><button class="btn gold" id="submitReport" '+(already?'disabled':'')+'>'+(already?'已提交，等待其他调查员':'提交结案意见')+'</button>':'<div class="case-sheet">现有资料尚无法支持正式结论。请继续调查。</div>')+'</div>'}
function endingView(){const d=state.case;return '<div class="panel"><div class="brand">CASE CLOSED / '+esc(d.title)+'</div><h2>案件结案</h2>'+(d.ending||[]).map(x=>'<div class="case-sheet"><h3>'+esc(x.title)+'</h3>'+mediaBlock(x.mediaPath)+'<p>'+esc(x.text)+'</p></div>').join('')+(d.hook?'<div class="divider"></div><div class="brand">AFTER CREDITS</div><h3>未记录的讯息</h3><p class="lead">'+esc(d.hook)+'</p>':'')+'<button class="btn" id="finishLeave">返回大厅</button></div>'}
function wireScene(){if($('#finishLeave'))$('#finishLeave').onclick=leave;
 const vid=$('#scene-video'),seek=$('#timeline');if(vid&&seek){vid.ontimeupdate=()=>{seek.max=vid.duration||100;seek.value=vid.currentTime;$('#timecode').textContent='00:'+String(Math.floor(vid.currentTime/60)).padStart(2,'0')+':'+String(Math.floor(vid.currentTime%60)).padStart(2,'0')};seek.oninput=()=>{vid.currentTime=Number(seek.value)}}
 const compare=$('#compare');if(compare)compare.onclick=async()=>{let a=$('#pair-a').value,b=$('#pair-b').value;if(!a||!b||a===b)return message('请选择两份不同材料',true);try{busy=true;const r=await api('proof',{clueIds:[a,b],withMedia:false});if(r.ok===false)return message(r.message||'无法形成有效关联',true);state=r;renderGame();message('资料核对完成')}catch(e){message(e.message,true)}finally{busy=false}};
 const submit=$('#submitReport');if(submit)submit.onclick=async()=>{let answers={};for(const r of state.case.report||[]){let item=document.querySelector('input[name="r-'+CSS.escape(r.id)+'"]:checked');if(!item)return message('请填写完整结案意见',true);answers[r.id]=item.value}try{busy=true;const v=await api('vote',{answers});if(v.ok===false)return message(v.message,true);state=v;renderGame();message(v.room.status==='finished'?'案件已结案':'已提交，等待其他调查员')}catch(e){message(e.message,true)}finally{busy=false}}
}
async function openClue(id){let c=find(clues(),id);if(!c)return;modalClue=id;const has=collected(id);$('#modal').innerHTML='<div class="dialog"><div class="brand">INVESTIGATION MATERIAL / '+esc(id)+'</div><h2>'+esc(c.title)+'</h2>'+(has?mediaBlock(c.mediaPath)+'<p class="lead">'+esc(c.description||'')+'</p>':'<p class="lead">此处发现一份未经登记的材料。</p>')+'<div class="divider"></div><div class="buttons">'+(!has?'<button class="btn gold" id="collect">收录到案卷</button>':'')+'<button class="btn" id="closeModal">关闭</button></div></div>';$('#modal').classList.remove('hidden');$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');if(!has)$('#collect').onclick=async()=>{try{busy=true;let v=await api('collect',{id,withMedia:true});state={...v,media:{...(state?.media||{}),...(v.media||{})}};$('#modal').classList.add('hidden');renderGame();openClue(id);message('资料已入档')}catch(e){message(e.message,true)}finally{busy=false}}}
function wire(){document.addEventListener('click',async e=>{
 const src=e.target.closest('[data-start],[data-screen],[data-clue],[data-solve],[data-cctv]');if(!src)return;
 if(src.dataset.start){newRoomDialog(src.dataset.start);return}
 if(src.dataset.screen){screen=src.dataset.screen;renderGame();return}
 if(src.dataset.clue){openClue(src.dataset.clue);return}
 if(src.dataset.solve){const p=src.dataset.solve,inp=document.querySelector('[data-puzzle-input="'+CSS.escape(p)+'"]');try{busy=true;const v=await api('solve',{id:p,answer:inp?.value||'',withMedia:true});if(v.ok===false)return message(v.message,true);state={...v,media:{...(state?.media||{}),...(v.media||{})}};renderGame();message('机关已解除')}catch(e){message(e.message,true)}finally{busy=false}return}
 if(src.dataset.cctv){const vid=$('#scene-video');if(!vid)return message('此场景尚未配置可回放的视频',true);let cmd=src.dataset.cctv;if(cmd==='pause')vid.paused?vid.play():vid.pause();else if(cmd==='speed'){vid.playbackRate=vid.playbackRate===1?.5:vid.playbackRate===.5?2:1;src.textContent='速度 '+vid.playbackRate+'×'}else if(cmd==='zoom'){vid.style.objectFit=vid.style.objectFit==='cover'?'contain':'cover';vid.style.transform=vid.style.transform==='scale(1.35)'?'scale(1)':'scale(1.35)';vid.parentElement.style.overflow='hidden'}else vid.currentTime=Math.max(0,Math.min(vid.duration||3600,vid.currentTime+Number(cmd)))}
 });$('#joinbtn').onclick=()=>joinDialog();document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.add('hidden')})}
function digestState(v){return JSON.stringify({s:v.room.status,players:v.players.map(p=>p.id),e:v.events.map(x=>x.kind+':'+x.item_id).sort(),seat:v.me.seat})}
async function poll(force=false){if(busy)return;try{const s=await api('state',{withMedia:force});let sig=digestState(s),changed=force||sig!==lastSignature;const old=state;state={...s,media:{...(old?.media||{}),...(s.media||{})}};if(changed){lastSignature=sig;if(old?.room.status==='playing'&&state.room.status==='playing'&&!$('#opening').classList.contains('hidden')){return}if(old?.room.status==='playing'&&state.room.status==='playing'&&screen!=='board'&&screen!=='report'&&!$('#game').classList.contains('hidden')){$('#worknav').innerHTML=gameNav();return}await postState();}else if(state.room.status==='lobby')roomView();}catch(e){if(force)message('读取房间失败：'+e.message,true)}}
async function postState(){if(!escapeRoom()){roomView();return}if(screen!=='board'&&screen!=='report'&&!find(sceneList(),screen))screen=sceneList()[0]?.id||'board';renderGame(true);if(!introSeen(state.room.code))startOpening()}
async function init(){wire();let join=new URLSearchParams(location.search).get('join');if(token){await poll(true);if(state){poller=setInterval(()=>poll(false),5000);return}sessionStorage.removeItem('case-player-session');token=''}
 show('landing');await loadCatalog();if(join)joinDialog(join);if(slug&&!token){const c=caseList.find(x=>x.slug===slug);if(c)newRoomDialog(slug)}
 poller=setInterval(()=>{if(token)poll(false)},5000)}
init();
</script></body></html>
