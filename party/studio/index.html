<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASE STUDIO · 案件工作室</title><style>
:root{--bg:#0b1015;--surface:#151e26;--panel:#1a252e;--edge:#334450;--text:#eef2f1;--mute:#9eafb7;--gold:#cfac73;--success:#8dbba5;--danger:#e3a29b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#1e2a32,#0b1015 65%);color:var(--text);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;font-size:14px;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.hidden{display:none!important}.muted{color:var(--mute)}.mono{font-family:ui-monospace,Consolas,monospace}.brand{font-size:11px;letter-spacing:.19em;color:var(--gold);font-weight:800}.shell{max-width:1440px;margin:auto;padding:22px 24px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.top h1{font-size:24px;margin:6px 0 0;letter-spacing:.01em}.btn{border:1px solid var(--edge);background:#26333c;color:var(--text);border-radius:9px;padding:10px 13px;transition:.2s;white-space:nowrap}.btn:hover{border-color:#9f8b6d;background:#30414a}.btn.gold{background:var(--gold);border-color:var(--gold);color:#131b20;font-weight:800}.btn.danger{color:var(--danger)}.btn.sml{padding:7px 9px;font-size:12px}.buttons{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.sidebar{position:sticky;top:18px;height:max-content;border:1px solid var(--edge);border-radius:14px;background:#111b22;padding:12px}.sidebar button{display:block;text-align:left;width:100%;margin:3px 0;border:0;background:transparent;color:#b9c6cd;padding:11px 12px;border-radius:7px}.sidebar button.active,.sidebar button:hover{background:#26343c;color:#f9e1b9}.sidebar .label{color:#687f8c;font:10px ui-monospace,monospace;letter-spacing:.18em;padding:10px}.panel{background:linear-gradient(145deg,#17222a,#121a21);border:1px solid var(--edge);border-radius:14px;padding:20px;min-width:0}.sectiontitle{font-size:17px;margin:0 0 8px}.sub{color:var(--mute);font-size:12px;line-height:1.8;margin:0 0 18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px;min-width:0}.field>span{font-size:12px;color:#b7c9d0}input,textarea,select{width:100%;background:#0b141a;color:var(--text);border:1px solid #3b4c57;border-radius:8px;padding:12px;outline:0;min-width:0}textarea{min-height:96px;resize:vertical;line-height:1.65}input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 2px #cba96f1a}select{appearance:auto}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.entry{background:#101920;border:1px solid #30414c;border-radius:10px;padding:16px;margin-bottom:12px}.entryhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.entryhead h3{margin:0;font-size:14px}.tip{font-size:11px;color:#8ea2ac;line-height:1.7}.badge{font-size:10px;letter-spacing:.1em;border:1px solid #53636a;border-radius:30px;padding:5px 8px;color:#aac1c6}.badge.live{border-color:#4f836d;color:#a0d3b9}.listcase{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.caseitem{padding:18px;border:1px solid var(--edge);border-radius:12px;background:#162128;cursor:pointer}.caseitem:hover{border-color:var(--gold)}.caseitem h3{font-size:16px}.login{width:min(470px,calc(100% - 32px));margin:12vh auto;background:#15212a;border:1px solid #3d4d56;border-radius:18px;padding:30px}.login h1{font-size:26px}.status{color:var(--gold);font-size:12px}.mini-preview{border-radius:10px;border:1px solid #45525c;background:#090e12;max-width:420px;min-height:380px;margin:12px auto;padding:16px;box-shadow:0 16px 60px #0006}.mini-preview h3{color:#dfc190}.mini-preview img,.mini-preview video{display:block;max-width:100%;max-height:300px;object-fit:contain;margin:10px auto}.hor{display:flex;justify-content:space-between;align-items:center;gap:12px}.upload{border:1px dashed #677580;border-radius:8px;background:#17222b;padding:14px;display:flex;flex-direction:column;gap:10px}.upload small{overflow-wrap:anywhere}.notice{padding:12px 15px;background:#152b30;border-left:3px solid var(--gold);font-size:12px;line-height:1.8;margin-bottom:17px}.toast{position:fixed;right:16px;bottom:16px;max-width:min(400px,calc(100% - 32px));background:#26353d;border:1px solid var(--gold);padding:15px;border-radius:10px;z-index:10;box-shadow:0 10px 50px #0008}.divider{height:1px;background:#30404a;margin:17px 0}a{color:#e4c18a}.dangertext{color:var(--danger)}.wide{width:100%}.skin{background:#16232a;border-radius:8px;padding:11px}.code{font-family:Consolas,monospace;font-size:12px;overflow:auto}.statusline{margin-left:auto}.hide-mobile{display:block}@media(max-width:800px){.shell{padding:15px 12px 90px}.grid{grid-template-columns:1fr}.sidebar{position:relative;top:auto;display:flex;overflow:auto;gap:5px;scrollbar-width:none;padding:7px}.sidebar button{white-space:nowrap;width:auto}.sidebar .label{display:none}.top{align-items:flex-start;flex-wrap:wrap}.top h1{font-size:20px}.panel{padding:15px}.cols,.cols3{grid-template-columns:1fr}.entry{padding:12px}.hide-mobile{display:none}} 
</style></head><body>
<div id="login" class="login"><div class="brand">YETIPSY PARTY · CASE STUDIO</div><h1>案件工作室</h1><p class="muted">在这里创作悬疑故事、安排机关、上传照片与视频。只有管理员可以编辑和发布。</p><label class="field"><span>管理员密钥</span><input id="key" type="password" autocomplete="off" placeholder="粘贴管理员密钥"></label><div class="buttons"><button class="btn gold" id="signin">进入工作室</button></div><p id="loginmsg" class="status"></p></div>
<div id="app" class="shell hidden"><header class="top"><div><div class="brand">YETIPSY PARTY / CASE STUDIO</div><h1 id="headtitle">案件管理</h1></div><div class="buttons"><span class="status statusline" id="saveflag"></span><button id="save" class="btn gold hidden">保存草稿</button><button id="exit" class="btn sml">退出</button></div></header><div id="dashboard"></div><div id="editor" class="grid hidden"><nav class="sidebar" id="tabs"></nav><main class="panel"><div id="workspace"></div></main></div></div>
<input type="file" id="fileinput" accept="image/*,video/mp4,video/webm,audio/*" class="hidden"><div id="toast" class="toast hidden"></div>
<script>
const ENDPOINT='https://hlsjzwqqrojjxrcngcbt.supabase.co/functions/v1/party-case-studio';
const PLAY='https://yetipsy98-cpu.github.io/yetipsy-tonight/party/studio/play.html';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=(tag='item')=>tag+'-'+Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
let token=sessionStorage.getItem('case-studio-session')||'', cases=[],doc=null,tab='base',dirty=false,media={},uploadTarget=null;
const tabs=[['base','案件设定'],['intro','开场剧情'],['scenes','调查场景'],['clues','调查材料'],['puzzles','解密机关'],['proofs','证据关联'],['report','结案判断'],['ending','结局与彩蛋'],['preview','手机预览'],['json','备份 / 导入']];
async function api(op,data={}){let r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,token,...data})});let j=await r.json().catch(()=>({error:'NETWORK_ERROR'}));if(!r.ok||j.error)throw Error(j.error||'REQUEST_FAILED');return j}
const alerting=(text,bad=false)=>{let t=$('#toast');t.textContent=text;t.style.borderColor=bad?'#dd8880':'#cfa96d';t.classList.remove('hidden');clearTimeout(alerting.t);alerting.t=setTimeout(()=>t.classList.add('hidden'),3800)};
const mark=()=>{dirty=true;$('#saveflag').textContent='有未保存的修改';localStorage.setItem('party-studio-unsaved',JSON.stringify({id:doc?.id||null,doc}));};
const seed=()=>({id:null,version:1,slug:'case-'+Math.random().toString(36).slice(2,7),status:'draft',content:{title:'未命名案件',subtitle:'',description:'',coverPath:'',duration:35,minPlayers:2,maxPlayers:6,intro:[{id:id('intro'),title:'案件前情',text:'这里写入第一幕的故事。',mediaPath:''}],scenes:[{id:'scene-entry',title:'现场勘察',type:'room',role:'all',body:'点击场景里的位置，调查隐藏线索。',mediaPath:'',videoPath:'',hotspots:[]}],clues:[],puzzles:[],proofs:[],report:[],ending:[{id:id('ending'),title:'案件结案',text:'在这里揭晓本集真相。',mediaPath:''}],hook:'',isPublic:false}});
function statusName(v){return v==='published'?'已发布':v==='archived'?'已归档':'草稿'}
async function loadCases(){let v=await api('admin_list');cases=v.cases;$('#dashboard').innerHTML='<div class="panel"><div class="hor"><div><h2 class="sectiontitle">我的案件</h2><p class="sub">每个案件独立创作。发布后玩家在案件大厅开房，原游戏不会受影响。</p></div><button class="btn gold" data-act="new">＋ 创建案件</button></div><div class="listcase">'+cases.map(c=>'<div class="caseitem" data-act="open" data-id="'+esc(c.id)+'"><div class="hor"><span class="brand">'+esc(c.slug)+'</span><span class="badge '+(c.status==='published'?'live':'')+'">'+statusName(c.status)+'</span></div><h3>'+esc(c.title)+'</h3><p class="muted">'+esc(c.subtitle||'尚未填写介绍')+'</p><small class="muted">版本 '+c.version+' · '+new Date(c.updated_at).toLocaleString()+'</small></div>').join('')+'<div class="caseitem" data-act="new"><h3>＋ 创建新案件</h3><p class="muted">选择场景、添加线索和机关，开始新故事</p></div></div></div>';$('#dashboard').classList.remove('hidden');$('#editor').classList.add('hidden');$('#save').classList.add('hidden');$('#headtitle').textContent='案件管理'}
async function openCase(caseId){if(dirty&&!confirm('本地修改尚未保存，确定离开？'))return;let r=await api('admin_get',{id:caseId});doc=r.case;media=r.media||{};dirty=false;tab='base';showEditor();}
function showEditor(){$('#dashboard').classList.add('hidden');$('#editor').classList.remove('hidden');$('#save').classList.remove('hidden');$('#headtitle').textContent=doc.content.title||'未命名案件';drawTabs();render();updateFlag()}
function updateFlag(){$('#saveflag').textContent=dirty?'有未保存的修改':statusName(doc.status)}
function drawTabs(){$('#tabs').innerHTML='<div class="label">案件编辑器</div>'+tabs.map(([k,t])=>'<button data-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+t+'</button>').join('')+'<div class="label">管理</div><button data-act="back">返回案件列表</button><button data-act="publish">发布当前案件</button><button data-act="archive">归档案件</button>'}
function field(obj,prop,label,kind='text',hint='',type='text'){let v=obj?.[prop]??'';let path='content.'+prop;return '<label class="field"><span>'+esc(label)+'</span>'+(kind==='textarea'?'<textarea data-field="'+esc(path)+'" placeholder="'+esc(hint)+'">'+esc(v)+'</textarea>':'<input data-field="'+esc(path)+'" type="'+type+'" value="'+esc(v)+'" placeholder="'+esc(hint)+'">')+'</label>'}
function control(prop,label,kind='text',hint=''){return field(doc.content,prop,label,kind,hint)}
function select(value,path,label,opts){return '<label class="field"><span>'+esc(label)+'</span><select data-field="'+esc(path)+'">'+opts.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(value)===String(v)?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label>'}
function mediaControl(path,title,value){let u=media[value];return '<div class="upload"><div class="hor"><b>'+esc(title)+'</b><button class="btn sml" data-upload="'+esc(path)+'">上传文件</button></div><small class="muted">'+(value?esc(value):'尚未上传')+'</small>'+(u?(value?.match(/\.(mp4|webm)$/)?'<video src="'+esc(u)+'" controls style="width:100%;max-height:200px"></video>':'<img src="'+esc(u)+'" style="width:100%;max-height:200px;object-fit:contain">'):'')+'<small class="tip">支持图片、视频和音频；单文件建议 ≤ 20MB，最长 50MB。上传后请保存草稿。</small></div>'}
function entryBar(label,idx,kind){return '<div class="entryhead"><h3>'+esc(label)+' <span class="muted">#'+(idx+1)+'</span></h3><div class="buttons"><button class="btn sml" data-move="'+kind+':'+idx+':up">↑</button><button class="btn sml" data-move="'+kind+':'+idx+':down">↓</button><button class="btn sml danger" data-delete="'+kind+':'+idx+'">移除</button></div></div>'}
function inputPath(path,label,value,kind='text',placeholder=''){return '<label class="field"><span>'+esc(label)+'</span>'+(kind==='textarea'?'<textarea data-path="'+esc(path)+'" placeholder="'+esc(placeholder)+'">'+esc(value??'')+'</textarea>':'<input data-path="'+esc(path)+'" value="'+esc(value??'')+'" placeholder="'+esc(placeholder)+'">')+'</label>'}
function optsText(list){return (list||[]).join(', ')}
function roles(value,path){return select(value,path,'由谁查看', [['all','所有玩家'],['0','第1位玩家'],['1','第2位玩家'],['2','第3位玩家'],['3','第4位玩家'],['4','第5位玩家'],['5','第6位玩家']])}
function base(){return '<h2 class="sectiontitle">案件信息</h2><p class="sub">你可以独立创建每一集，正式发布前只有管理员可见。</p><div class="cols">'+control('title','案件名称')+control('subtitle','一句话介绍')+control('duration','预计时长（分钟）')+control('description','故事简介','textarea')+control('minPlayers','最少玩家数')+control('maxPlayers','最多玩家数')+'</div>'+inputPath('slug','案件网址标识',doc.slug)+'<p class="tip">英文小写、数字与连接号，发布后用于案件网址，建议不要随意改动。</p>'+mediaControl('content.coverPath','案件封面',doc.content.coverPath)}
function slides(key){let list=doc.content[key]||[];return '<h2 class="sectiontitle">'+(key==='intro'?'开场剧情':'结局与彩蛋')+'</h2><p class="sub">'+(key==='intro'?'玩家开始后按顺序观看这些故事画面。可上传照片、视频或语音素材。':'本集需要有完整答案；最后可附上第二集的彩蛋，但不能把本集结论推迟到下一集。')+'</p>'+list.map((x,i)=>'<div class="entry">'+entryBar(x.title||'剧情镜头',i,key)+inputPath('content.'+key+'.'+i+'.title','镜头标题',x.title)+inputPath('content.'+key+'.'+i+'.text','解说／字幕',x.text,'textarea')+mediaControl('content.'+key+'.'+i+'.mediaPath','镜头素材',x.mediaPath)+'</div>').join('')+'<button class="btn gold" data-add="'+key+'">＋ 添加镜头</button>'+(key==='ending'?'<div class="divider"></div>'+control('hook','下一集钩子／片尾文字','textarea'):'')}
function sceneEditor(){let sc=doc.content.scenes||[];return '<h2 class="sectiontitle">调查场景</h2><p class="sub">场景是游戏中的真实操作空间，例如 CCTV、手机、房间、档案室。把图片或视频与线索绑定，玩家才能搜证。</p>'+sc.map((x,i)=>'<div class="entry">'+entryBar(x.title||'场景',i,'scenes')+'<div class="cols">'+inputPath('content.scenes.'+i+'.title','场景名称',x.title)+select(x.type,'content.scenes.'+i+'.type','场景模版',[['room','场景搜证'],['cctv','监控回放'],['phone','虚拟手机'],['terminal','安保终端'],['archive','档案室'],['witness','人物访谈'],['photo','照片调查']])+roles(x.role,'content.scenes.'+i+'.role')+inputPath('content.scenes.'+i+'.id','场景识别码（关联其他资料）',x.id)+'</div>'+inputPath('content.scenes.'+i+'.body','现场说明（不要暴露谜底）',x.body,'textarea')+mediaControl('content.scenes.'+i+'.mediaPath','主场景图片 / 视频',x.mediaPath)+'<div class="cols">'+inputPath('content.scenes.'+i+'.startSecond','监控起始秒数（可选）',x.startSecond||0)+inputPath('content.scenes.'+i+'.endSecond','监控结束秒数（可选）',x.endSecond||60)+'</div><div class="notice">场景里的可点热点和密码机关在「调查材料」「解密机关」中设置。玩家看到的是现场，而不是后台配置项。</div></div>').join('')+'<button class="btn gold" data-add="scenes">＋ 新建调查场景</button>'}
function cluesEditor(){return '<h2 class="sectiontitle">调查材料</h2><p class="sub">加入正确线索、背景资料或误导材料；玩家不会看到它们属于哪一类。不要预先在证据墙筛选正确资料。</p>'+(doc.content.clues||[]).map((x,i)=>'<div class="entry">'+entryBar(x.title||'材料',i,'clues')+'<div class="cols">'+inputPath('content.clues.'+i+'.title','资料标题',x.title)+inputPath('content.clues.'+i+'.id','资料识别码',x.id)+select(x.sceneId,'content.clues.'+i+'.sceneId','出现位置',(doc.content.scenes||[]).map(a=>[a.id,a.title]))+roles(x.role,'content.clues.'+i+'.role')+inputPath('content.clues.'+i+'.hotspotX','热点位置 X（0–100）',x.hotspotX??50)+inputPath('content.clues.'+i+'.hotspotY','热点位置 Y（0–100）',x.hotspotY??50)+'</div>'+inputPath('content.clues.'+i+'.description','玩家查看的资料正文',x.description,'textarea')+mediaControl('content.clues.'+i+'.mediaPath','资料图片 / 音频 / 视频',x.mediaPath)+'<label class="field"><span>仅供作者标记（玩家不会看到）</span><select data-path="content.clues.'+i+'.decoy"><option value="false" '+(!x.decoy?'selected':'')+'>核心 / 背景资料</option><option value="true" '+(x.decoy?'selected':'')+'>干扰资料</option></select></label></div>').join('')+'<button class="btn gold" data-add="clues">＋ 添加原始资料</button>'}
function puzzleEditor(){return '<h2 class="sectiontitle">解密机关</h2><p class="sub">玩家输入正确结果才解锁。答案只存储在后台，公开游戏数据不会带出密码。</p>'+(doc.content.puzzles||[]).map((x,i)=>'<div class="entry">'+entryBar(x.title||'机关',i,'puzzles')+'<div class="cols">'+inputPath('content.puzzles.'+i+'.title','机关名称',x.title)+inputPath('content.puzzles.'+i+'.id','机关 ID',x.id)+select(x.type,'content.puzzles.'+i+'.type','机关类型',[['pin','数字密码'],['text','文字 / 指令输入'],['choice','判断选项'],['order','顺序排列']])+select(x.sceneId,'content.puzzles.'+i+'.sceneId','所在场景',(doc.content.scenes||[]).map(a=>[a.id,a.title]))+roles(x.role,'content.puzzles.'+i+'.role')+inputPath('content.puzzles.'+i+'.answer','正确答案（不对玩家显示）',x.answer)+'</div>'+inputPath('content.puzzles.'+i+'.prompt','玩家看到的机关内容',x.prompt,'textarea')+inputPath('content.puzzles.'+i+'.choicesText','选项（逗号分隔，选项型使用）',(x.choices||[]).join(','))+inputPath('content.puzzles.'+i+'.requiresCluesText','解锁前须收集的资料 ID（逗号分隔）',(x.requiresClues||[]).join(','))+select(x.rewardClueId||'','content.puzzles.'+i+'.rewardClueId','解开后自动取得资料',[['','无'],...(doc.content.clues||[]).map(c=>[c.id,c.title])])+'</div>').join('')+'<button class="btn gold" data-add="puzzles">＋ 添加机关</button>'}
function proofEditor(){return '<h2 class="sectiontitle">证据交叉验证</h2><p class="sub">此处建立有效证明关系：玩家必须先找到指定资料，然后在案卷中组合。无效组合不会获得正确提示。</p>'+(doc.content.proofs||[]).map((x,i)=>'<div class="entry">'+entryBar(x.title||'关联',i,'proofs')+'<div class="cols">'+inputPath('content.proofs.'+i+'.id','关联 ID',x.id)+inputPath('content.proofs.'+i+'.title','关系名称（仅通过后显示）',x.title)+'</div>'+inputPath('content.proofs.'+i+'.clueIdsText','构成关联的资料 ID（逗号分隔）',(x.clueIds||[]).join(','))+inputPath('content.proofs.'+i+'.description','关联成立后的发现',x.description,'textarea')+'</div>').join('')+'<button class="btn gold" data-add="proofs">＋ 新增证据关联</button>'}
function reportEditor(){return '<h2 class="sectiontitle">结案判断</h2><p class="sub">只有收集并验证了必要证明，才允许提交结论。每道问题可设置三个答案，正确答案只在服务器验证。</p>'+(doc.content.report||[]).map((x,i)=>'<div class="entry">'+entryBar(x.label||'结案问题',i,'report')+inputPath('content.report.'+i+'.id','问题 ID',x.id)+inputPath('content.report.'+i+'.label','问题',x.label)+inputPath('content.report.'+i+'.choicesText','备选答案（用逗号分隔）',(x.choices||[]).map(c=>c.label).join(','))+inputPath('content.report.'+i+'.correct','正确答案编号（0、1、2，从0开始）',x.correct??'0')+inputPath('content.report.'+i+'.requiresProofsText','提交前必须形成的证据关联 ID',(x.requiresProofs||[]).join(','))+'</div>').join('')+'<button class="btn gold" data-add="report">＋ 添加结案问题</button>'}
function preview(){const d=doc.content;let a=(d.intro||[])[0]||{},sc=(d.scenes||[])[0]||{};let url=media[sc.mediaPath]||media[d.coverPath]||'';return '<h2 class="sectiontitle">手机预览</h2><p class="sub">预览案卷与场景布局，不会产生公开房间或向其他玩家展示草稿。</p><div class="mini-preview"><div class="brand">CASE FILE / '+esc(doc.slug)+'</div><h3>'+esc(d.title)+'</h3><p class="muted">'+esc(d.subtitle)+'</p><div class="divider"></div><div class="brand">序章</div><h3>'+esc(a.title||'案情简报')+'</h3><p>'+esc(a.text||'')+'</p><div class="divider"></div><div class="brand">'+esc(sc.type||'ROOM')+'</div><h3>'+esc(sc.title||'')+'</h3>'+(url?'<img src="'+esc(url)+'">':'<div class="skin">此处显示你上传的现场图片或视频</div>')+'<p>'+esc(sc.body||'')+'</p></div><p class="tip">这里是静态视觉预览。完整解密与多人体验需先保存、发布，再从案件大厅开房。</p>'}
function jsonEditor(){return '<h2 class="sectiontitle">备份 / 导入</h2><p class="sub">可将一个案件的全部故事、场景、机关配置导出为 JSON。图片视频保留私有素材路径，不会嵌入大文件。</p><div class="buttons"><button class="btn" data-act="export">导出 JSON</button><button class="btn" data-act="import">导入 JSON</button><button class="btn" data-act="demo">载入示例模板（覆盖当前未保存内容）</button></div><div class="divider"></div><textarea style="min-height:300px" id="jsonpreview" readonly>'+esc(JSON.stringify(doc.content,null,2))+'</textarea><p class="tip">新增案件建议通过左侧模块编辑。导入只修改当前草稿，不会直接发布。</p>'}
function render(){let el=$('#workspace');const map={base, intro:()=>slides('intro'), scenes:sceneEditor,clues:cluesEditor,puzzles:puzzleEditor,proofs:proofEditor,report:reportEditor,ending:()=>slides('ending'),preview,json:jsonEditor};el.innerHTML=(map[tab]||base)();drawTabs();updateFlag()}
function put(path,value){let p=path.split('.'),root=path==='slug'?doc:doc;let target=root;for(let i=0;i<p.length-1;i++)target=target[p[i]];let k=p[p.length-1];if(['hotspotX','hotspotY','duration','minPlayers','maxPlayers','startSecond','endSecond'].includes(k))value=Number(value)||0;if(k==='decoy')value=value==='true';if(k==='correct')value=String(value);if(k==='choicesText'){target.choices=String(value).split(',').map((x,i)=>({id:String(i),label:x.trim()})).filter(x=>x.label);mark();return}if(k==='clueIdsText'||k==='requiresCluesText'||k==='requiresProofsText'){target[k.replace('Text','')]=String(value).split(',').map(s=>s.trim()).filter(Boolean);mark();return}target[k]=value;mark()}
function add(kind){const c=doc.content,sceneId=c.scenes?.[0]?.id||'';if(!Array.isArray(c[kind]))return;let n={id:id(kind)};if(kind==='intro'||kind==='ending')n={...n,title:'新镜头',text:'',mediaPath:''};if(kind==='scenes')n={...n,title:'新场景',type:'room',role:'all',body:'',mediaPath:'',startSecond:0,endSecond:60};if(kind==='clues')n={...n,title:'未知资料',description:'',sceneId,role:'all',mediaPath:'',hotspotX:50,hotspotY:50,decoy:false};if(kind==='puzzles')n={...n,title:'待解机关',type:'pin',sceneId,role:'all',prompt:'',answer:'',choices:[],requiresClues:[],rewardClueId:''};if(kind==='proofs')n={...n,title:'待核实的联系',clueIds:[],description:''};if(kind==='report')n={...n,label:'需要查明的问题',choices:[{id:'0',label:'选项A'},{id:'1',label:'选项B'},{id:'2',label:'选项C'}],correct:'0',requiresProofs:[]};c[kind].push(n);mark();render()}
function sample(){let d=seed();d.content.title='失踪的维修工程师';d.content.subtitle='一份检修记录，改变了整栋大楼的时间线';d.content.intro=[{id:id('intro'),title:'午夜报告',text:'午夜，一名检修工程师在四楼消失。你们被要求重查最后一段监控录像。',mediaPath:''}];d.content.scenes=[{id:'floor4',title:'四楼走廊',type:'cctv',role:'all',body:'检查通道与门禁记录。',mediaPath:'',startSecond:0,endSecond:60}];d.content.clues=[{id:'card',title:'门禁卡记录',sceneId:'floor4',role:'all',description:'出入记录显示 00:17 有人使用临时权限。',mediaPath:'',hotspotX:35,hotspotY:50,decoy:false},{id:'notice',title:'停电通知',sceneId:'floor4',role:'all',description:'本楼曾预告凌晨可能短暂测试电路。',mediaPath:'',hotspotX:70,hotspotY:60,decoy:true}];d.content.puzzles=[{id:'door',title:'旧门禁终端',type:'pin',sceneId:'floor4',role:'all',prompt:'输入门禁记录中的四位解锁码。',answer:'0017',requiresClues:['card'],rewardClueId:''}];d.content.proofs=[{id:'contradiction',title:'时间线存在矛盾',clueIds:['card','notice'],description:'通知不能直接解释门禁异常。'}];d.content.report=[{id:'location',label:'失踪者最后被确认出现在哪里？',choices:[{id:'0',label:'四楼走廊'},{id:'1',label:'天台'},{id:'2',label:'地下室'}],correct:'0',requiresProofs:['contradiction']}];d.content.ending=[{id:id('end'),title:'调查结案',text:'失踪工程师的最后位置确认在四楼，异常门禁记录需要进一步核查。',mediaPath:''}];d.content.hook='片尾：另一栋建筑也出现了相同的时间戳。';doc.content=d.content;mark();tab='base';render()}
async function save(){if(!doc)return;try{const r=await api('admin_save',{case:{id:doc.id,slug:doc.slug,version:doc.version,title:doc.content.title,content:doc.content}});doc=r.case;dirty=false;localStorage.removeItem('party-studio-unsaved');updateFlag();alerting('草稿已保存');$('#headtitle').textContent=doc.title}catch(e){alerting('保存失败：'+e.message,true)}}
async function publish(){if(dirty){await save();if(dirty)return}if(!doc.id)return alerting('请先保存案件',true);if(!confirm('发布后玩家可在案件大厅打开，你确定资料与答案已经准备好吗？'))return;try{let r=await api('admin_publish',{id:doc.id});doc=r.case;render();alerting('案件已发布');}catch(e){alerting('发布失败：'+e.message,true)}}
async function upload(file){if(!doc||!uploadTarget)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(file.size>50000000)return alerting('文件超过 50MB，请压缩后再上传',true);try{alerting('正在取得上传权限…');const r=await api('admin_upload',{type:file.type,size:file.size,ext});const fd=new FormData();fd.append('cacheControl','3600');fd.append('',file);let up=await fetch(r.uploadUrl,{method:'PUT',body:fd,headers:{'x-upsert':'false'}});if(!up.ok)throw Error('UPLOAD_HTTP_'+up.status);put(uploadTarget,r.path);media[r.path]=URL.createObjectURL(file);render();alerting('文件已上传。记得保存草稿。')}catch(e){alerting('上传失败：'+e.message,true)}finally{uploadTarget=null;$('#fileinput').value=''}}
$('#signin').onclick=async()=>{try{const r=await api('admin_login',{key:$('#key').value});token=r.token;sessionStorage.setItem('case-studio-session',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#key').value='';await loadCases()}catch(e){$('#loginmsg').textContent='无法登录：'+e.message}};
$('#key').addEventListener('keydown',e=>{if(e.key==='Enter')$('#signin').click()});
$('#exit').onclick=async()=>{try{await api('admin_logout')}catch{}sessionStorage.removeItem('case-studio-session');token='';location.reload()};
$('#save').onclick=save;
$('#fileinput').onchange=e=>{const f=e.target.files?.[0];if(f)upload(f)};
document.addEventListener('input',e=>{if(!doc)return;const k=e.target.dataset.path||e.target.dataset.field;if(k)put(k,e.target.value)});
document.addEventListener('change',e=>{if(!doc)return;const k=e.target.dataset.path||e.target.dataset.field;if(k)put(k,e.target.value)});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act],[data-tab],[data-add],[data-delete],[data-move],[data-upload]');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();return}
 if(b.dataset.add)return add(b.dataset.add);
 if(b.dataset.upload){uploadTarget=b.dataset.upload;$('#fileinput').click();return}
 if(b.dataset.delete){const [k,i]=b.dataset.delete.split(':');if(confirm('确定移除这个项目？')){doc.content[k].splice(Number(i),1);mark();render()}return}
 if(b.dataset.move){const [k,i,d]=b.dataset.move.split(':'),a=doc.content[k],from=Number(i),to=from+(d==='up'?-1:1);if(to>=0&&to<a.length){[a[from],a[to]]=[a[to],a[from]];mark();render()}return}
 switch(b.dataset.act){
 case 'new':if(dirty&&!confirm('放弃当前未保存修改？'))return;doc=seed();media={};dirty=true;tab='base';showEditor();break;
 case 'open':await openCase(b.dataset.id);break;
 case 'back':if(dirty&&!confirm('还有未保存修改，返回列表？'))return;dirty=false;doc=null;await loadCases();break;
 case 'publish':await publish();break;
 case 'archive':if(!doc?.id||!confirm('归档后玩家将无法再创建此案件的新房间。确定？'))return;try{await api('admin_archive',{id:doc.id});dirty=false;doc=null;await loadCases()}catch(e){alerting(e.message,true)}break;
 case 'export':{let blob=new Blob([JSON.stringify(doc.content,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(doc.slug||'case')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);break}
 case 'import':{let input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=async()=>{try{let s=await input.files[0].text(),v=JSON.parse(s);if(!v||!Array.isArray(v.scenes))throw Error('无效案件配置');doc.content=v;mark();tab='base';render()}catch(e){alerting('导入失败：'+e.message,true)}};input.click();break}
 case 'demo':if(confirm('将示例内容覆盖当前草稿？'))sample();break;
 }
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
(async()=>{if(token){try{await api('admin_list');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await loadCases()}catch{sessionStorage.removeItem('case-studio-session');token=''}}})();
</script></body></html>
