<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YÉ TIPSY · 月满杯盈</title>
<style>
:root{--gold:#d8ad57;--cream:#f5ecd8;--bg:#080806}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#62471e55,transparent 26%),var(--bg);color:var(--cream);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.app{max-width:460px;min-height:100vh;margin:auto;padding:20px}.logo{text-align:center;color:#dfb969;letter-spacing:.22em;font:18px Georgia}.logo small{display:block;font:9px system-ui;letter-spacing:.32em;margin-top:5px}.hero{text-align:center;margin:28px 0 10px}.hero h1{font:700 48px KaiTi,serif;color:#f0dca9;margin:6px}.hero p{font-size:12px;color:#a0947e}.small{font-size:10px;color:#807460;text-align:center;line-height:1.65}.stage{height:330px;margin:14px -20px;background:radial-gradient(ellipse,#352417,#0b0806 72%);position:relative;overflow:hidden}.moon{position:absolute;right:24px;top:20px;width:85px;height:85px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2bd,#d5a34a 65%,#805b24);opacity:.82}.cup{position:absolute;z-index:5;left:50%;top:55px;transform:translateX(-50%);width:180px;height:200px;border-radius:22px 22px 52px 52px;background:linear-gradient(105deg,#3a3027,#080706 38%,#211b15);border:1px solid #5d4930;box-shadow:0 24px 35px #000b}.cup b{display:block;text-align:center;margin-top:85px;color:#cda75c;letter-spacing:.16em;font:18px Georgia}.cup.up{animation:up .8s forwards}@keyframes up{to{transform:translate(-50%,-220px);opacity:.08}}.dice{position:absolute;left:50%;bottom:45px;transform:translateX(-50%);width:310px;height:95px}.die{position:absolute;width:53px;height:53px;border-radius:11px;background:#f7f1df;box-shadow:0 7px 10px #0008}.pip{position:absolute;width:8px;height:8px;border-radius:50%;background:#191713}.tl{left:10px;top:10px}.tr{right:10px;top:10px}.ml{left:10px;top:22px}.mr{right:10px;top:22px}.c{left:22px;top:22px}.bl{left:10px;bottom:10px}.br{right:10px;bottom:10px}button{width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(135deg,#f0ce7d,#c88f32);color:#171009;font-size:16px;font-weight:900}button:disabled{opacity:.45}.result{text-align:center;margin:15px 0;padding:17px;border:1px solid #554225;border-radius:18px;background:#100d09;display:none}.result.show{display:block}.result h2{color:#e3bc6c}.lock,.sheet{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.sheet{display:none;align-items:flex-end;background:#0006}.box{width:min(100%,410px);background:#14100c;border:1px solid #5b472d;border-radius:22px;padding:20px}.box h2{text-align:center;color:#e3bc6c}.box input,.box select{width:100%;padding:13px;border-radius:12px;border:1px solid #493b27;background:#090806;color:#fff;margin:6px 0}.phone{display:flex;gap:6px}.phone select{width:110px}.check{font-size:11px;color:#a99b82;display:flex;gap:8px;margin:10px 0}.check input{width:auto}.code{font:900 24px monospace;background:linear-gradient(135deg,#e8c675,#b9802c);color:#171009;padding:16px;border-radius:14px}.qr{background:#fff;padding:10px;border-radius:14px;width:190px;height:190px;margin:14px auto}.qr img{width:100%;height:100%}
</style>
</head>
<body>
<main class="app">
<div class="logo">YÉ TIPSY<small>2.0 · 栖野微醺</small></div>
<div class="hero"><div class="small">MID-AUTUMN LIMITED</div><h1>月满杯盈</h1><p>今晚的月亮，有多圆？</p></div>
<div class="stage"><div class="moon"></div><div class="cup" id="cup"><b>YÉ TIPSY</b></div><div class="dice" id="dice"></div></div>
<button id="roll" disabled>摇月亮</button>
<div class="small">5颗骰子 · 一摇定胜负 · 活动结果以系统设定概率为准</div>

<div class="result" id="result"><div id="count"></div><h2 id="reward"></h2><div>🎁 奖励于下次光临兑换</div></div>

<div class="result" id="success">
<h2>已为你保留奖励 🌕</h2>
<div>奖励将在 <b>3 个工作日内</b>发送至你填写的 WhatsApp。</div>
<p class="small">请立即截图保存「奖励找回码」</p>
<div class="code" id="code"></div>
<p id="summary" class="small"></p>
<h3 style="color:#e3bc6c">加入 Ye Tipsy 社群 🌙</h3>
<div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=https%3A%2F%2Fchat.whatsapp.com%2FGvzQip5KbuI6rWLO78880p"></div>
<div class="small">请使用自己的手机扫码加入 · 自愿加入 · 不影响本次奖励</div>
</div>
</main>

<div class="lock" id="lock">
<div class="box">
<h2>员工授权</h2>
<p class="small">每位顾客开始前由员工解锁。本次授权只能完成一局。</p>
<input id="staff" type="password" placeholder="员工密码">
<button id="unlock">解锁本次游戏</button>
<p class="small" id="err"></p>
</div>
</div>

<div class="sheet" id="claim">
<div class="box">
<h2 id="claimTitle">领取奖励</h2>
<div class="phone">
<select id="cc"><option value="+60">🇲🇾 +60</option><option value="+65">🇸🇬 +65</option></select>
<input id="phone" inputmode="numeric" placeholder="WhatsApp 手机号码">
</div>
<label class="check"><input type="checkbox" id="community">我愿意收到 Ye Tipsy 社群邀请及活动 / 新品消息（选填）</label>
<p class="small">奖励将在 3 个工作日内发送至你填写的 WhatsApp。请确认号码正确。</p>
<button id="claimBtn">领取我的奖励</button>
</div>
</div>

<script>
const API_URL=https://script.google.com/macros/s/AKfycbzCFtnhDubjakfhj3fbdDKa7hUZ0eJV6GCfc62TqQkwWETfTkvcglbip1sYxcuI4hqlNg/exec";
const pip={1:["c"],2:["tl","br"],3:["tl","c","br"],4:["tl","tr","bl","br"],5:["tl","tr","c","bl","br"],6:["tl","tr","ml","mr","bl","br"]};
const pos=[[12,20],[72,9],[132,25],[192,8],[252,22]];
let token="",rolled=null;

async function api(action,data={}){
  try{
    const r=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({action:"moon",subaction:action},data))
    });
    return JSON.parse(await r.text());
  }catch(e){
    return {ok:false,error:"network_error"};
  }
}
function draw(a){
  dice.innerHTML=a.map((n,i)=>`<div class="die" style="left:${pos[i][0]}px;top:${pos[i][1]}px">${pip[n].map(x=>`<i class="pip ${x}"></i>`).join("")}</div>`).join("");
}
unlock.onclick=async()=>{
  err.textContent="";
  unlock.disabled=true;
  const d=await api("unlock",{password:staff.value});
  unlock.disabled=false;
  if(!d.ok){
    const map={wrong_password:"员工密码错误",activity_closed:"活动目前已关闭",staff_password_not_configured:"请先在后台设置员工密码",network_error:"无法连接活动后台"};
    err.textContent=map[d.error]||("无法解锁："+d.error);
    return;
  }
  token=d.unlockToken;
  staff.value="";
  lock.style.display="none";
  roll.disabled=false;
};
roll.onclick=async()=>{
  roll.disabled=true;
  roll.textContent="正在摇月亮…";
  if(navigator.vibrate)navigator.vibrate([80,50,80,50,120]);
  const d=await api("roll",{unlockToken:token});
  if(!d.ok){
    alert("无法开始："+d.error);
    location.reload();
    return;
  }
  rolled=d;
  cup.classList.add("up");
  setTimeout(()=>{
    draw(d.dice);
    count.textContent=`你摇出了 ${d.displayOnes} 个「1」`;
    reward.textContent=d.reward;
    result.classList.add("show");
    claimTitle.textContent=d.reward;
    claim.style.display="flex";
    roll.textContent="本局已完成";
  },800);
};
claimBtn.onclick=async()=>{
  const p=phone.value.replace(/\D/g,"");
  const country=cc.value;
  const valid=country==="+65"?p.length===8:(p.length>=9&&p.length<=11);
  if(!valid){alert("请检查 WhatsApp 手机号码");return}
  claimBtn.disabled=true;
  claimBtn.textContent="正在保存…";
  const d=await api("claim",{
    unlockToken:token,
    countryCode:country,
    phone:p,
    communityOptIn:community.checked
  });
  if(!d.ok){
    claimBtn.disabled=false;
    claimBtn.textContent="领取我的奖励";
    alert("保存失败："+d.error);
    return;
  }
  token="";
  claim.style.display="none";
  code.textContent=d.recoveryCode;
  summary.textContent="奖励："+d.reward+" · WhatsApp："+country+" "+p;
  success.classList.add("show");
  success.scrollIntoView({behavior:"smooth"});
};
</script>
</body>
</html>
