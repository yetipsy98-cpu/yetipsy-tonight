<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YÉ TIPSY · Staff</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090806;color:#f2ead9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px}
.wrap{max-width:460px;margin:auto}.brand{color:#dfb867;letter-spacing:.1em;margin-bottom:4px}
.card{background:#14100c;border:1px solid #493a25;border-radius:18px;padding:18px;margin:14px 0}
input,button{width:100%;padding:13px;border-radius:11px;margin:6px 0;font-size:15px}
input{background:#090806;color:white;border:1px solid #4b3a25}
button{border:0;background:#d9ae5c;color:#171009;font-weight:800;cursor:pointer}
button:disabled{opacity:.55}.secondary{background:#30271b;color:#ead9b8}.redeemBtn{background:#1e1912;color:#dfb867;border:1px solid #806532}
.muted{font-size:12px;color:#9d9079}.hide{display:none!important}#qr{display:block;width:220px;height:220px;background:#fff;padding:10px;border-radius:14px;margin:14px auto}
.reward{font-size:20px;color:#dfb867;font-weight:800}.ok{color:#a9d994}.bad{color:#ee9988}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:14px}
.sheet{width:min(100%,460px);max-height:90vh;overflow:auto;background:#14100c;border:1px solid #5b472c;border-radius:22px;padding:18px;box-shadow:0 -20px 70px rgba(0,0,0,.5)}
.sheetHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheetHead h2{margin:4px 0 12px}.close{width:auto;padding:8px 12px;background:#30271b;color:#ead9b8}
.refBox{border:1px solid #806532;background:#0c0a07;border-radius:16px;padding:16px;text-align:center;margin:12px 0}
.refLabel{font-size:12px;color:#9d9079;letter-spacing:.12em}.ref{font-size:25px;font-weight:900;color:#dfb867;letter-spacing:.04em;margin-top:6px;word-break:break-all}
.receipt{background:#f5efe4;color:#18130d;border-radius:18px;padding:22px;margin:14px 0}.receipt h2{margin:0 0 4px}.receipt .gold{color:#80611e}.receipt hr{border:0;border-top:1px solid #d5c8b5;margin:16px 0}
.row{display:flex;justify-content:space-between;gap:16px;margin:9px 0;font-size:14px}.row span:first-child{color:#756b5e}.row b{text-align:right;word-break:break-word}
</style>
</head>
<body><div class="wrap">
<h1 class="brand">YÉ TIPSY · STAFF</h1><div class="muted">月满杯盈 · 服务员工作台</div>

<div id="login" class="card">
<h2>服务员登入</h2>
<input id="user" placeholder="员工账号">
<input id="pass" type="password" placeholder="密码">
<button id="loginBtn">登入</button><div id="loginMsg" class="muted"></div>
</div>

<div id="panel" class="hide">
<div class="card">
<h2>生成新一局</h2>
<div class="muted">每位顾客生成一个独立二维码；领取后本局失效。</div>
<button id="newBtn">生成顾客二维码</button>
<div id="newMsg" class="muted"></div>
<img id="qr" class="hide" alt="顾客游戏二维码">
<div id="codeText" class="muted"></div>
<button id="localBtn" class="secondary hide">顾客不扫码？在这台员工手机直接玩</button>
</div>

<div class="actions">
<button id="openRedeemBtn" class="redeemBtn">核销奖励</button>
<button id="logoutBtn" class="secondary">登出</button>
</div>
</div>
</div>

<!-- Redeem modal -->
<div id="redeemModal" class="modal hide">
<div class="sheet">
<div class="sheetHead"><h2>核销奖励</h2><button id="closeRedeemBtn" class="close">关闭</button></div>
<div id="redeemForm">
<input id="redeemCode" autocomplete="off" autocapitalize="characters" placeholder="输入最后 8 位，例如 A1B2C3D4">
<button id="lookupBtn" class="secondary">查询兑换码</button>
<div id="claimInfo"></div>
<button id="confirmBtn" class="hide">确认核销</button>
</div>

<div id="redeemSuccess" class="hide">
<div id="receipt" class="receipt">
<h2>YÉ TIPSY</h2><div class="gold">月满杯盈 · 核销记录</div><hr>
<div class="row"><span>状态</span><b>✓ 核销成功</b></div>
<div class="row"><span>奖励</span><b id="rReward"></b></div>
<div class="row"><span>兑换码</span><b id="rCode"></b></div>
<div class="row"><span>REF</span><b id="rRef" class="gold"></b></div>
<div class="row"><span>员工</span><b id="rStaff"></b></div>
<div class="row"><span>时间</span><b id="rTime"></b></div>
<hr><div style="text-align:center;font-size:12px;color:#756b5e">@ye_tipsy · Internal redemption record</div>
</div>
<button id="saveReceiptBtn">保存核销截图</button>
<button id="doneBtn" class="secondary">完成</button>
<div id="saveMsg" class="muted"></div>
</div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzCFtnhDubjakfhj3fbdDKa7hUZ0eJV6GCfc62TqQkwWETfTkvcglbip1sYxcuI4hqlNg/exec";
const GAME_URL=new URL("moon-game.html",location.href).href;
let staffToken=localStorage.getItem("moon_staff_token")||"",currentCode="",currentGameUrl="",lastReceipt=null;
const $=id=>document.getElementById(id);
const savedUser=localStorage.getItem("moon_staff_user")||"";
if(savedUser)$("user").value=savedUser;

fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"ping"}),cache:"no-store"}).catch(()=>{});
async function api(subaction,data={}){
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"moon",subaction,...data})});
    return JSON.parse(await r.text());
  }catch(e){return{ok:false,error:"network_error"}}
}
function enter(){$("login").classList.add("hide");$("panel").classList.remove("hide")}
if(staffToken){
  enter();
  api("staffCheck",{staffToken}).then(d=>{
    if(!d.ok){localStorage.removeItem("moon_staff_token");$("panel").classList.add("hide");$("login").classList.remove("hide");$("loginMsg").textContent="登入已过期，请重新登入一次";}
  });
}
$("loginBtn").onclick=async()=>{
  $("loginBtn").disabled=true;$("loginMsg").textContent="登入中…";
  const d=await api("staffLogin",{username:$("user").value.trim(),password:$("pass").value});
  $("loginBtn").disabled=false;
  if(!d.ok){$("loginMsg").textContent="登入失败："+d.error;return}
  staffToken=d.staffToken;localStorage.setItem("moon_staff_token",staffToken);localStorage.setItem("moon_staff_user",$("user").value.trim());enter();
};

$("newBtn").onclick=async()=>{
  $("newBtn").disabled=true;$("newMsg").textContent="正在生成本局…";$("qr").classList.add("hide");$("localBtn").classList.add("hide");$("codeText").textContent="";
  const d=await api("staffCreateGame",{staffToken});$("newBtn").disabled=false;
  if(!d.ok){
    $("newMsg").textContent=d.error==="staff_auth"?"登入已过期，请重新登入":"生成失败："+d.error;
    if(d.error==="staff_auth"){localStorage.removeItem("moon_staff_token");setTimeout(()=>location.reload(),800)}
    return;
  }
  currentGameUrl=GAME_URL+"?g="+encodeURIComponent(d.gameToken);
  $("codeText").textContent="本局 "+d.shortCode+" · 二维码一次有效";$("localBtn").classList.remove("hide");
  const qrUrl="https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data="+encodeURIComponent(currentGameUrl);
  let retried=false;
  $("qr").onload=()=>{$("qr").classList.remove("hide");$("newMsg").textContent="本局已生成 · 可扫码或直接本机玩"};
  $("qr").onerror=()=>{if(!retried){retried=true;setTimeout(()=>{$("qr").src=qrUrl+"&_="+Date.now()},350)}else{$("qr").classList.add("hide");$("newMsg").textContent="本局已生成；二维码暂时无法载入，可直接用员工手机开始。"}};
  $("qr").src=qrUrl;
};
$("localBtn").onclick=()=>{if(currentGameUrl)location.href=currentGameUrl};

function openRedeem(){
  $("redeemModal").classList.remove("hide");$("redeemSuccess").classList.add("hide");$("redeemForm").classList.remove("hide");
  $("redeemCode").value="";$("claimInfo").innerHTML="";$("confirmBtn").classList.add("hide");currentCode="";lastReceipt=null;
  setTimeout(()=>$("redeemCode").focus(),150);
}
function closeRedeem(){$("redeemModal").classList.add("hide")}
$("openRedeemBtn").onclick=openRedeem;
$("closeRedeemBtn").onclick=closeRedeem;
$("redeemModal").onclick=e=>{if(e.target===$("redeemModal"))closeRedeem()};

$("lookupBtn").onclick=async()=>{
  currentCode=$("redeemCode").value.trim().toUpperCase();$("claimInfo").innerHTML="查询中…";$("confirmBtn").classList.add("hide");
  const d=await api("staffRedeemLookup",{staffToken,code:currentCode});
  if(!d.ok){
    $("claimInfo").innerHTML='<p class="bad">'+(d.error==="code_not_found"?"找不到这个兑换码":d.error==="code_ambiguous"?"尾号重复，请输入完整兑换码":d.error==="staff_auth"?"登入已过期":d.error)+'</p>';return;
  }
  const c=d.claim;
  $("claimInfo").innerHTML=`<p class="reward">${escapeHtml(c.reward)}</p><p>兑换码：<b>${escapeHtml(c.code)}</b></p><p class="muted">状态：${c.redeemed?"已核销":"尚未核销"} · WhatsApp ${escapeHtml(c.phone||"")}${c.redeemRef?`<br>REF：${escapeHtml(c.redeemRef)}`:""}</p>`;
  if(!c.redeemed)$("confirmBtn").classList.remove("hide");
};
$("confirmBtn").onclick=async()=>{
  if(!currentCode)return;
  if(!confirm("确认已经给顾客兑换奖励？核销后不能再次使用。"))return;
  $("confirmBtn").disabled=true;
  const d=await api("staffRedeem",{staffToken,code:currentCode});
  $("confirmBtn").disabled=false;
  if(!d.ok){alert(d.error==="already_redeemed"?"此奖励已经核销":"核销失败："+d.error);return}
  lastReceipt={reward:d.reward,code:d.code,ref:d.redeemRef||"",staff:d.redeemedBy||localStorage.getItem("moon_staff_user")||"",time:d.redeemedAt||new Date().toISOString()};
  showReceipt(lastReceipt);
};
function showReceipt(r){
  $("redeemForm").classList.add("hide");$("redeemSuccess").classList.remove("hide");
  $("rReward").textContent=r.reward;$("rCode").textContent=r.code;$("rRef").textContent=r.ref;$("rStaff").textContent=r.staff;$("rTime").textContent=formatTime(r.time);$("saveMsg").textContent="";
}
function formatTime(v){
  const d=new Date(v);if(isNaN(d))return String(v||"");
  return new Intl.DateTimeFormat("zh-MY",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d);
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

$("saveReceiptBtn").onclick=async()=>{
  if(!lastReceipt)return;
  const blob=await buildReceiptPng(lastReceipt);
  const file=new File([blob],`YETIPSY-${lastReceipt.ref||"REDEEM"}.png`,{type:"image/png"});
  // 手机上优先调出系统保存/分享面板；不支持时直接下载 PNG。
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"YÉ TIPSY 核销记录"});$("saveMsg").textContent="核销记录已生成，可保存到相册。";return}catch(e){if(e.name==="AbortError")return}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  $("saveMsg").textContent="核销记录图片已保存/下载。";
};
$("doneBtn").onclick=closeRedeem;

async function buildReceiptPng(r){
  const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");
  x.fillStyle="#f5efe4";x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#18130d";x.textAlign="center";x.font="900 68px system-ui";x.fillText("YÉ TIPSY",540,130);
  x.fillStyle="#80611e";x.font="600 32px system-ui";x.fillText("月满杯盈 · 核销记录",540,188);
  x.strokeStyle="#d5c8b5";x.lineWidth=2;x.beginPath();x.moveTo(100,245);x.lineTo(980,245);x.stroke();
  x.fillStyle="#18130d";x.font="800 46px system-ui";x.fillText("✓ 核销成功",540,330);
  const rows=[["奖励",r.reward],["兑换码",r.code],["REF",r.ref],["员工",r.staff],["时间",formatTime(r.time)]];
  let y=445;
  for(const [k,v] of rows){
    x.textAlign="left";x.fillStyle="#756b5e";x.font="500 30px system-ui";x.fillText(k,120,y);
    x.textAlign="right";x.fillStyle=k==="REF"?"#80611e":"#18130d";x.font=k==="REF"?"900 38px system-ui":"700 31px system-ui";
    fitCanvasText(x,String(v||""),960,y,650);
    y+=125;
  }
  x.strokeStyle="#d5c8b5";x.beginPath();x.moveTo(100,1080);x.lineTo(980,1080);x.stroke();
  x.textAlign="center";x.fillStyle="#756b5e";x.font="500 27px system-ui";x.fillText("@ye_tipsy · Internal redemption record",540,1160);
  x.font="500 23px system-ui";x.fillText("请以系统 MOON_GAME 记录为最终核销依据",540,1210);
  return await new Promise(res=>c.toBlob(res,"image/png",0.95));
}
function fitCanvasText(ctx,text,rightX,y,maxWidth){
  let size=parseInt(ctx.font)||31;
  while(ctx.measureText(text).width>maxWidth&&size>20){size-=1;ctx.font=ctx.font.replace(/\d+px/,size+"px")}
  ctx.fillText(text,rightX,y);
}
$("logoutBtn").onclick=()=>{localStorage.removeItem("moon_staff_token");location.reload()};
</script>
</body></html>
