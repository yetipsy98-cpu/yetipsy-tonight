<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yetipsy Staff</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><div class="topbar"><div><div class="brand" id="staffTitle">Staff</div><div class="sub">Hi, <span id="who"></span></div></div><div class="row" id="ownerNav"></div></div><div id="notice"></div>
<div class="grid g2"><div class="card compact-card"><div class="row between"><h3 class="section-title">Scan Pass</h3><span id="scanState" class="badge">Ready</span></div><div id="reader" style="max-width:350px"></div><div class="scan-status">扫到二维码后直接打开资料。</div><div class="inline-search tight"><label style="margin:0">扫不上？输入 Ref<input id="tokenInput" class="mini-input" placeholder="YT-G-XXXXXX" onkeydown="if(event.key==='Enter')manualLookup()"></label><button class="btn2" onclick="manualLookup()">Search</button></div></div>
<div class="card compact-card hidden" id="passCard"><div class="row between"><h3 class="section-title">Pass</h3><button class="btn2 scan-next" onclick="scanNext()">Scan Next</button></div><div id="passInfo"></div><hr class="line"><h3 class="section-title">Check-in & Payment</h3><div class="compact-grid"><label>Male<input id="amale" type="number" min="0" value="0"></label><label>Female<input id="afemale" type="number" min="0" value="0"></label><label>Pax<input id="apax" type="number" readonly value="0"></label></div><div class="compact-grid two"><label>Table<input id="tableNo" placeholder="T03"></label><label>Remark<input id="checkRemark" placeholder="Optional"></label></div><div id="ownerCustomPrice" class="hidden owner-price-box"><div class="row between"><b>Owner Custom Price</b><span class="small muted">Only this check-in</span></div><div class="compact-grid two"><label>Male Price<input id="customMale" type="number" min="0" step="0.01"></label><label>Female Price<input id="customFemale" type="number" min="0" step="0.01"></label></div><button class="btn2" type="button" onclick="resetOwnerPrice()" style="margin-top:8px">Use System Price</button></div><div id="batchPreview" class="pricebox"></div><button class="ok" onclick="checkinPay()" style="margin-top:10px">Confirm Check-in & Payment</button><div id="lastResult" class="hidden pricebox"></div></div></div>
<div class="card compact-card" style="margin-top:12px"><h3 class="section-title">Recent Payments</h3><div id="recent" class="table-scroll"></div></div></div>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script src="config.js"></script><script src="app.js"></script><script>
let current=null,scanner=null,scanning=false;const sess=session(),isOwner=sess?.role==='admin';if(requireRole('staff')){if(isOwner){$('#staffTitle').textContent='Owner · Staff Mode';$('#ownerNav').innerHTML='<a class="modebtn" href="admin.html">Owner Dashboard</a><a class="modebtn active" href="staff.html">Staff Mode</a><a class="modebtn" href="ambassador.html">Ambassador Mode</a><button class="btn2" onclick="logout()">Logout</button>';$('#ownerCustomPrice').classList.remove('hidden')}else{$('#ownerNav').innerHTML='<button class="btn2" onclick="logout()">Logout</button>'}startScanner();loadRecent();['amale','afemale'].forEach(id=>$('#'+id).addEventListener('input',syncPax));['customMale','customFemale'].forEach(id=>$('#'+id)?.addEventListener('input',updatePreview))}
function startScanner(){if(scanning)return;scanning=true;$('#scanState').textContent='Scanning';try{scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:205,rememberLastUsedCamera:true},false);scanner.render(async text=>{if(!scanning)return;scanning=false;$('#scanState').textContent='Loading';try{await scanner.clear()}catch(e){}await loadPass(text)},()=>{})}catch(e){scanning=false;$('#scanState').textContent='Camera unavailable'}}
async function loadPass(raw){try{const t=String(raw||'').trim().replace(/^YT:/,'');current=await api('lookupPass',{token_or_ref:t});$('#passCard').classList.remove('hidden');$('#scanState').textContent='Loaded';$('#lastResult').classList.add('hidden');renderPass();$('#passCard').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){toast(e.message,'error');$('#scanState').textContent='Ready';startScanner()}}
async function manualLookup(){const v=$('#tokenInput').value.trim();if(!v)return;await loadPass(v)}
function scanNext(){current=null;$('#passCard').classList.add('hidden');$('#tokenInput').value='';$('#amale').value='0';$('#afemale').value='0';$('#apax').value='0';$('#tableNo').value='';$('#checkRemark').value='';$('#lastResult').classList.add('hidden');$('#scanState').textContent='Ready';$('#reader').innerHTML='';startScanner()}
function renderPass(){const p=current;const closed=['CLOSED','PAID','VOID'].includes(String(p.status));if(isOwner){$('#customMale').value=Number(p.male_price||0).toFixed(2);$('#customFemale').value=Number(p.female_price||0).toFixed(2)}$('#passInfo').innerHTML=`<div class="row between"><b>${esc(p.pass_ref)}</b><span class="pill">${esc(p.status)}</span></div><div class="pass-summary"><div class="summary-cell"><div class="k">Ambassador</div><div class="v">${esc(p.ambassador_name)}</div></div><div class="summary-cell"><div class="k">Date</div><div class="v">${esc(p.reservation_date)}</div></div><div class="summary-cell"><div class="k">Reserved</div><div class="v">${Number(p.planned_pax||0)} pax</div></div><div class="summary-cell"><div class="k">Actual</div><div class="v">${Number(p.actual_pax||0)} · ${Number(p.actual_male||0)}M/${Number(p.actual_female||0)}F</div></div></div><div class="price-pair tight"><div class="price-chip"><div class="k">Male</div><div class="v">${money(p.male_price)}</div></div><div class="price-chip"><div class="k">Female</div><div class="v">${money(p.female_price)}</div></div></div><div class="muted small tight">${esc(p.price_source||'')} ${p.price_note?'· '+esc(p.price_note):''} · Sales ${money(p.sales||0)}</div>${closed?'<div class="notice error tight">Pass 已关闭，不能再 Check-in。</div>':''}`;document.querySelector('.ok').disabled=closed;syncPax()}
function syncPax(){const m=Math.max(0,Number($('#amale').value||0)),f=Math.max(0,Number($('#afemale').value||0));$('#apax').value=m+f;updatePreview()}
function effectivePrices(){return{mp:isOwner&&$('#customMale').value!==''?Number($('#customMale').value):Number(current?.male_price||0),fp:isOwner&&$('#customFemale').value!==''?Number($('#customFemale').value):Number(current?.female_price||0)}}
function resetOwnerPrice(){if(!current)return;$('#customMale').value=Number(current.male_price||0).toFixed(2);$('#customFemale').value=Number(current.female_price||0).toFixed(2);updatePreview()}
function updatePreview(){if(!current)return;const m=Number($('#amale').value||0),f=Number($('#afemale').value||0),{mp,fp}=effectivePrices(),amt=Math.round((m*mp+f*fp)*100)/100;const after=Number(current.actual_pax||0)+m+f;const full=after>=Number(current.planned_pax||0);$('#batchPreview').innerHTML=`${m}M × ${money(mp)} + ${f}F × ${money(fp)} = <span class="bigdue">${money(amt)}</span><br><span class="small muted">After check-in: ${after}/${Number(current.planned_pax||0)} pax ${full?'· 满员后自动 Close Pass':''}</span>`}
async function checkinPay(){try{const m=Number($('#amale').value||0),f=Number($('#afemale').value||0),pax=m+f;if(!(pax>0))throw new Error('请输入男女人数');const {mp,fp}=effectivePrices();if(mp<0||fp<0)throw new Error('价格不能小于 0');const amount=Math.round((m*mp+f*fp)*100)/100;if(!confirm(`确认 Check-in ${pax} pax，并收款 ${money(amount)}？
确认后 Sales / Commission 会立即入账。`))return;const payload={pass_id:current.pass_id,male:m,female:f,table_no:$('#tableNo').value,remark:$('#checkRemark').value};if(isOwner){payload.custom_male_price=mp;payload.custom_female_price=fp}const d=await api('partialRedeem',payload);current=d.pass;$('#lastResult').classList.remove('hidden');$('#lastResult').innerHTML=`Paid <b>${money(d.sales_amount)}</b> · Ref <b>${esc(d.redeem_ref)}</b>${d.closed?'<br><b>PASS CLOSED</b>':''}`;toast(d.closed?'Payment confirmed · Pass closed':'Payment confirmed','success');$('#amale').value='0';$('#afemale').value='0';$('#apax').value='0';$('#checkRemark').value='';renderPass();loadRecent()}catch(e){toast(e.message,'error')}}
async function loadRecent(){try{const d=await api('staffRecent');$('#recent').innerHTML=`<table><tr><th>Ref</th><th>Pass</th><th>M/F</th><th>Sales</th><th>Time</th></tr>${d.map(x=>`<tr><td>${esc(x.redeem_ref)}</td><td>${esc(x.pass_ref)}</td><td>${Number(x.male_charged||0)}/${Number(x.female_charged||0)}</td><td>${money(x.sales_amount)}</td><td>${fmtDate(x.created_at)}</td></tr>`).join('')}</table>`}catch(e){}}
</script></body></html>
