<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YETIPSY Owner Control</title><link rel="stylesheet" href="styles.css"><style>.admin{width:min(100%,620px);margin:auto;padding:24px}.field{width:100%;padding:14px;margin:7px 0;background:#12100c;color:#f4ead8;border:1px solid rgba(230,206,164,.16);border-radius:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><div id="grain"></div><main class="admin"><div class="logo">YETIPSY / OWNER</div><h1 class="title" style="margin-top:40px">Tonight Control</h1><p class="lead">用于创建全场 LIVE EVENT。不要把此页面或 Admin Key 给客人。</p><input class="field" id="api" placeholder="Apps Script /exec URL"><input class="field" id="key" type="password" placeholder="Admin Key"><input class="field" id="title" value="SOMETHING IS HAPPENING" placeholder="Event title"><textarea class="field" id="body" placeholder="Event mission">找到一个跟你同月份生日的人。不能是自己桌。</textarea><div class="row"><input class="field" id="mins" type="number" value="10" min="1" max="60"><button class="btn primary" id="live">GO LIVE</button></div><div id="msg" class="small"></div></main><script>document.getElementById('live').onclick=async()=>{let api=document.getElementById('api').value.trim(),key=document.getElementById('key').value,title=document.getElementById('title').value,body=document.getElementById('body').value,mins=+document.getElementById('mins').value||10;if(!api||!key)return msg.textContent='先填 API URL 和 Admin Key。';localStorage.setItem('yt_admin_api',api);let r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'adminEvent',key,title,body,starts_at:new Date().toISOString(),ends_at:new Date(Date.now()+mins*60000).toISOString()})});let j=await r.json();msg.textContent=j.ok?'LIVE EVENT 已发布。':'失败：'+(j.error||'unknown')};api.value=localStorage.getItem('yt_admin_api')||'';</script></body></html>
