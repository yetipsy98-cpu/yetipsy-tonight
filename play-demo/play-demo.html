<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse 75% 40% at 90% -12%,#75542744,transparent 95%),#0e0e0d;color:var(--cream);font:15px/1.55 system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}input,select{background:#10100e;border:1px solid #60503a;color:var(--cream);padding:12px;border-radius:10px;width:100%;min-height:45px}input[type=checkbox]{min-height:auto;width:auto;accent-color:var(--gold)}label{font-size:12px;color:#d6c4a9;font-weight:600}.shell{max-width:980px;margin:auto;padding:0 24px 70px}.mast{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 0 22px;border-bottom:1px solid #ffffff1b}.brand{font:700 25px/1.1 Georgia,serif;letter-spacing:.13em;color:var(--gold)}.brand-sub{font-size:10px;letter-spacing:.3em;color:#bdac90;margin-top:7px}.demo-pill{font-size:10px;font-weight:800;letter-spacing:.1em;color:#1f180d;background:var(--gold);border-radius:50px;padding:6px 10px}.safe-banner{border:1px solid #7b623f77;background:#e6bc7720;border-radius:13px;padding:11px 14px;font-size:12px;color:#dfcba9;margin:19px 0;display:flex;gap:10px;align-items:flex-start}.safe-banner strong{color:var(--gold)}.toprow{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0 14px}.eyebrow{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.25em}.headline{font-family:Georgia,"Noto Sans SC",serif;font-size:clamp(26px,4vw,42px);font-weight:500;margin:6px 0}.subtitle{font-size:13px;color:var(--muted);margin:5px 0 0}.switch{display:flex;gap:3px;padding:4px;background:#1a1917;border:1px solid #40382d;border-radius:15px}.switch button{border:0;background:transparent;color:#bdb09c;border-radius:11px;padding:10px 14px;font-size:13px;white-space:nowrap}.switch button.active{background:linear-gradient(135deg,#ebca91,#be8c4f);color:#211a11;font-weight:800;box-shadow:0 3px 14px #0005}.nav{display:flex;gap:8px;margin:20px 0 17px;overflow:auto}.nav button{padding:11px 17px;white-space:nowrap;border-radius:12px;background:#211e19;border:1px solid #4b4031;color:var(--muted)}.nav button.active{background:#3b2d1c;color:var(--gold);border-color:#9b7540}.panel{background:linear-gradient(155deg,#211d17,#161411);border:1px solid var(--border);border-radius:19px;padding:21px;margin:16px 0;box-shadow:var(--shadow)}.panel h2,.section-heading h2{color:var(--cream);margin:0 0 9px;font-size:18px}.panel h3{color:var(--gold);margin:0 0 11px;font-size:15px}.small{font-size:12px;color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.hero-main{min-height:192px;padding:25px;background:radial-gradient(circle at 85% 25%,#e0ad5338,transparent 52%),linear-gradient(135deg,#342719,#171511 83%);border:1px solid #8560396b;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between}.hero-main h2{font:400 clamp(26px,3.5vw,38px) Georgia,serif;margin:9px 0;color:#f3d39b}.hero-main p{font-size:13px;color:#d7c3a4;max-width:370px;margin:0}.hero-count{font:600 70px/1 Georgia,serif;color:#f3d9a6;text-align:center}.hero-aside{border:1px solid #69523870;border-radius:20px;padding:24px;background:#242018;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.section-heading{margin:29px 0 13px;display:flex;align-items:center;justify-content:space-between}.section-heading p{margin:0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.game-card{position:relative;text-align:left;background:linear-gradient(150deg,#242017,#161511);border:1px solid #554633;border-radius:18px;padding:18px;min-height:185px;color:var(--cream);display:flex;flex-direction:column;gap:7px;transition:transform .16s ease,border-color .16s ease}.game-card:not(:disabled):hover{transform:translateY(-3px);border-color:#c29755}.game-icon{font-size:40px;margin-bottom:3px}.game-title{font-size:16px;font-weight:800}.game-desc{font-size:12px;color:#a79b87}.game-tag{font-size:10px;color:var(--gold);border:1px solid #785f38;align-self:flex-start;border-radius:40px;padding:3px 9px;margin-top:auto}.game-card.disabled{opacity:.45}.button{border:0;background:linear-gradient(130deg,#f1d39c,#c2914e);color:#231a10;font-weight:850;border-radius:12px;padding:12px 19px;min-height:44px}.button.secondary{color:#dfbf86;background:#342a20;border:1px solid #745836}.button.ghost{color:#d7c39e;background:transparent;border:1px solid #655238}.button.danger{color:#f8bab0;background:#432823;border:1px solid #9c594e}.button.smallbtn{padding:7px 11px;min-height:34px;font-size:12px}.button.wide{width:100%}.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:11px}.item{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid #574734;background:#201b15;border-radius:15px;padding:16px}.item h3{margin:0 0 5px;color:#f5e8d2}.item p{margin:2px 0}.item .label{font-size:10px;color:var(--gold);letter-spacing:.09em}.muted{color:var(--muted)}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat{background:#221e18;padding:17px;border-radius:14px;border:1px solid #50402f}.stat .n{font:500 36px/1.35 Georgia,serif;color:#edcc90}.stat .k{color:#b8a98e;font-size:12px}.stage{background:radial-gradient(circle at 55% 22%,#74502e5a,#141210 65%);min-height:340px;border:1px solid #7156368a;border-radius:18px;padding:24px 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:16px;overflow:hidden}.stage-icon{font-size:64px;filter:drop-shadow(0 7px 14px #0005)}.stage-title{color:var(--gold);font-size:23px;font-weight:900}.dice{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.die{font-size:46px;display:inline-flex;background:#fff9ec;color:#24201a;border-radius:12px;width:59px;height:62px;align-items:center;justify-content:center;box-shadow:0 8px 17px #0007}.dice.shaking .die{animation:shake .15s linear infinite alternate}@keyframes shake{from{transform:translateY(-9px) rotate(-13deg)}to{transform:translateY(9px) rotate(13deg)}}.picker{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.pick{width:95px;height:135px;border-radius:13px;border:1px solid #bb985a;background:linear-gradient(145deg,#503b24,#211a13);color:#f9dd9a;font-size:49px;box-shadow:0 12px 23px #0005}.pick:disabled{opacity:.65}.pick:hover:not(:disabled){transform:translateY(-5px)}.reaction-pad{width:min(260px,80vw);height:130px;background:#4b3324;border:2px solid #d4a76e;border-radius:20px;color:#f8e5c7;font-weight:900;font-size:32px}.reaction-pad.go{background:#267650;border-color:#7ce3ab;color:white}.bar-track{position:relative;width:min(360px,90%);height:56px;background:#211b14;border:1px solid #87693e;border-radius:14px}.bar-target{position:absolute;left:45%;width:10%;height:100%;background:#d8b3707d}.bar-marker{position:absolute;top:-7px;left:0;width:6px;height:68px;border-radius:4px;background:#fff2c3;box-shadow:0 0 22px #ffe6aa}.reward-reveal{background:#332719;border:1px solid #c69a58;border-radius:16px;padding:19px;min-width:220px}.reward-reveal b{font-size:23px;color:#f8d99f}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}.tag{display:inline-block;background:#382b19;color:var(--gold);border:1px solid #806039;border-radius:40px;font-size:11px;padding:4px 9px}.tag.ok{background:#1d392b;color:#b9e3c4;border-color:#427653}.tag.off{background:#35231e;color:#e3a89d;border-color:#76514a}.code{font:800 clamp(25px,6vw,35px)/1.5 ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;color:#ffe0a2;background:#110f0b;border:1px dashed #99774c;border-radius:13px;padding:10px 16px;text-align:center;user-select:all}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #4a3a29;background:#211c16;border-radius:13px;padding:12px 15px;margin:8px 0}.notice{font-size:12px;padding:12px 14px;border-radius:12px;border:1px solid #866a41;background:#352716;color:#e4cba4}.notice.warn{background:#37241f;border-color:#986453;color:#e9b4a3}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:min(500px,calc(100vw - 32px));background:#392c20;color:#ffe4b8;border:1px solid #b78b50;border-radius:12px;padding:13px 17px;box-shadow:0 20px 45px #0009;z-index:1000;display:none;text-align:center}.footer{margin-top:36px;border-top:1px solid #504335;color:#907f6a;padding-top:18px;font-size:11px;display:flex;justify-content:space-between;gap:12px}.hide{display:none!important}.checkbox-line{display:flex;align-items:center;gap:8px}.reward-list{max-height:390px;overflow:auto}.owner-weight{display:grid;grid-template-columns:1fr 94px;align-items:center;gap:12px;margin:9px 0}.owner-weight input{text-align:center}.bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:minmax(90px,1fr) 100px 45px;align-items:center;gap:8px}.bar-track-mini{height:9px;border-radius:99px;background:#100e0b;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#8d632f,#e9c990)}.sep{height:1px;background:#504334;margin:18px 0}.empty{padding:25px 16px;border:1px dashed #65523c;border-radius:13px;text-align:center;color:#b3a58f}.head-actions{display:flex;align-items:center;gap:8px}.support{font-size:12px;color:#cfb88b}.logo-mark{color:#f0ca8d;font-family:Georgia,serif}.linkish{border:0;background:none;color:var(--gold);font-size:12px;text-decoration:underline;padding:5px}.setup-note{margin-top:8px;font-size:11px;color:#947c5c}
@media(max-width:780px){.hero{grid-template-columns:1fr 0.6fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.shell{padding:0 15px 44px}.mast{padding:18px 0}.brand{font-size:22px}.toprow{align-items:stretch}.switch{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.switch button{padding:10px 8px}.hero{grid-template-columns:1fr 116px;gap:10px}.hero-main{min-height:182px;padding:16px}.hero-main h2{font-size:26px}.hero-aside{padding:12px}.hero-count{font-size:55px}.grid{gap:9px}.game-card{padding:14px;min-height:170px}.game-icon{font-size:34px}.game-title{font-size:14px}.panel{padding:17px}.item{align-items:flex-start;flex-direction:column}.item .button{width:100%}.form-grid{grid-template-columns:1fr}.stage{min-height:310px;padding:16px 10px}.die{font-size:36px;width:48px;height:53px}.pick{width:84px;height:120px}.footer{flex-wrap:wrap}.owner-weight{grid-template-columns:1fr 76px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="shell">
<header class="mast"><div><div class="brand">YÉ TIPSY <span class="logo-mark">✦</span></div><div class="brand-sub">PLAY · REWARD HUB</div></div><span class="demo-pill">INTERACTIVE DEMO</span></header>
<div class="safe-banner"><span>ⓘ</span><div><strong>无需登录 · 本机试玩</strong>｜所有奖励、兑奖码及员工操作均为演示，不连接 Supabase、不发送短信、不是真实消费凭证。不同手机之间不会同步资料。</div></div>
<div class="toprow"><div><div class="eyebrow" id="roleEyebrow">GUEST EXPERIENCE</div><h1 class="headline" id="mainTitle">今晚，有点好玩。</h1><p class="subtitle" id="mainSub">用一次机会，解锁一次惊喜。</p></div><div class="switch" aria-label="切换试玩身份"><button type="button" data-role="guest" class="active">👤 顾客</button><button type="button" data-role="staff">🪪 Staff</button><button type="button" data-role="owner">✦ Owner</button></div></div>
<main id="content" aria-live="polite"></main>
<footer class="footer"><span>YÉ TIPSY PLAY · 仅供内部体验</span><span>DEMO ONLY · NOT REDEEMABLE</span></footer>
</div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
(() => {
const KEY='yetipsy-play-isolated-demo-v1';
const icon={dice:'🎲',card:'🃏',box:'🎁',reaction:'⚡',bar:'🎯'};
const gameLabels={dice:['幸运骰子','摇一摇 · 一局见分晓','LUCKY'],card:['神秘翻牌','三张牌，挑出你的惊喜','SURPRISE'],box:['神秘礼盒','选一个神秘的礼物','SURPRISE'],reaction:['反应挑战','绿灯一亮，越快越好','SKILL'],bar:['精准挑战','把光标停在最中央','SKILL']};
const seedRewards=[{id:'rw-voucher',name:'RM5 Voucher',weight:75},{id:'rw-shot',name:'彩虹 Shot ×1',weight:17},{id:'rw-milk',name:'微醺特调系列任一杯',weight:6},{id:'rw-special',name:'断片指南系列任一杯',weight:2}];
const safeRead=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}};
const uid=()=>{try{return crypto.randomUUID()}catch{return Date.now().toString(36)+Math.random().toString(36).slice(2)}};
const newCode=()=>Array.from({length:8},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const defaultState=()=>({version:1,created:Date.now(),campaignOpen:true,gameEnabled:{dice:true,card:true,box:true,reaction:true,bar:true},rewardDefs:structuredClone(seedRewards),passes:[{id:uid(),origin:'WELCOME PASS',status:'ready',created:Date.now()},{id:uid(),origin:'WELCOME PASS',status:'ready',created:Date.now()},{id:uid(),origin:'WELCOME PASS',status:'ready',created:Date.now()}],issuedCodes:[],awards:[{id:uid(),rewardId:'rw-voucher',name:'RM5 Voucher',origin:'WELCOME GIFT',created:Date.now(),redeemed:false,redeemCode:null,codeExpiry:0}],plays:[],pending:null});
let state=safeRead();if(!state || state.version!==1 || !Array.isArray(state.passes))state=defaultState();
let ui={role:'guest',tab:'play',selected:null,staffCode:'',claimValue:'',redeemValue:'',lookedUp:null,recentReward:null,quickCode:null};
let runtime=null,rollTimer=null,guardTimer=null,frame=0,toastTimer=null;
const $=(s)=>document.querySelector(s);
const H=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=(v)=>new Intl.NumberFormat('en-MY').format(v);
const fmt=(t)=>new Intl.DateTimeFormat('zh-MY',{timeZone:'Asia/Kuala_Lumpur',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('浏览器禁止储存：关闭页面后可能无法保留试玩记录')}};
const toast=(text)=>{const el=$('#toast');el.textContent=text;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3700)};
function cleanup(){if(runtime){runtime.cancelled=true;runtime=null}clearTimeout(rollTimer);clearTimeout(guardTimer);cancelAnimationFrame(frame)}
function rewardDraw(){const list=state.rewardDefs.filter(x=>Number(x.weight)>0);const total=list.reduce((sum,x)=>sum+Number(x.weight),0);if(!total)return state.rewardDefs[0];let pick=Math.random()*total;for(const item of list){pick-=Number(item.weight);if(pick<0)return item}return list.at(-1)}
function role(to){cleanup();ui.role=to;ui.lookedUp=null;ui.tab=to==='guest'?'play':to;render()}
function setTab(tab){cleanup();ui.tab=tab;render()}
function subSection(title,extra=''){return `<div class="section-heading"><h2>${title}</h2>${extra?`<p>${extra}</p>`:''}</div>`}
function banner(text,bad=false){return `<div class="notice ${bad?'warn':''}">${text}</div>`}
function stat(name,val){return `<div class="stat"><div class="n">${H(n(val))}</div><div class="k">${H(name)}</div></div>`}
const unused=()=>state.passes.filter(p=>p.status==='ready');
const availableGames=()=>Object.keys(gameLabels).filter(id=>state.gameEnabled[id]);
function render(){
  document.querySelectorAll('[data-role]').forEach(el=>el.classList.toggle('active',el.dataset.role===ui.role));
  const hero={guest:['GUEST EXPERIENCE','今晚，有点好玩。','用一次机会，解锁一次惊喜。'],staff:['STAFF WORKSPACE','让每桌都有得玩。','发机会、查奖励、确认核销。'],owner:['OWNER CONTROL','你决定今晚怎么玩。','开放游戏、配置奖励、看试玩表现。']}[ui.role];
  $('#roleEyebrow').textContent=hero[0];$('#mainTitle').textContent=hero[1];$('#mainSub').textContent=hero[2];
  $('#content').innerHTML=ui.role==='guest'?guest():ui.role==='staff'?staff():owner();
}
function guest(){
 const nav=`<div class="nav"><button data-tab="play" class="${ui.tab==='play'?'active':''}">🎮 PLAY</button><button data-tab="wallet" class="${ui.tab==='wallet'?'active':''}">🎁 REWARDS</button><button data-tab="me" class="${ui.tab==='me'?'active':''}">👤 ME</button></div>`;
 if(ui.tab==='wallet')return nav+wallet();
 if(ui.tab==='me')return nav+`<section class="panel"><div class="eyebrow">GUEST ACCOUNT · DEMO</div><h2 style="font:400 28px Georgia,serif;margin:12px 0">Hey, Guest 👋</h2><p class="small">这里模拟登录后会出现的账户页面。正式版将绑定顾客身份；试玩版全部保存在本机。</p><div class="stat-grid">${stat('游戏次数',state.plays.length)}${stat('获得奖励',state.awards.length)}${stat('未使用奖励',state.awards.filter(a=>!a.redeemed).length)}${stat('可用 Game Pass',unused().length)}</div></section>`;
 let cards=Object.entries(gameLabels).map(([key,labels])=>`<button class="game-card ${state.gameEnabled[key]?'':'disabled'}" data-select-game="${key}" ${!state.gameEnabled[key]?'disabled':''}><div class="game-icon">${icon[key]}</div><div class="game-title">${labels[0]}</div><div class="game-desc">${labels[1]}</div><div class="game-tag">${state.gameEnabled[key]?labels[2]:'CLOSED'}</div></button>`).join('');
 return nav+`<div class="hero"><div class="hero-main"><div><div class="eyebrow">YETIPSY · TONIGHT</div><h2>PLAY MORE.<br>FEEL MORE.</h2></div><p>不需要注册，先体验游戏怎么运作。</p></div><div class="hero-aside"><div class="eyebrow">MY PASSES</div><div class="hero-count">${unused().length}</div><div class="small">次可玩机会</div></div></div>`+
 (state.pending?banner(`你有一局「${H(gameLabels[state.pending.game]?.[0]||'游戏')}」尚未完成。 <button class="linkish" data-action="resume">恢复这一局</button>`):'')+
 (!state.campaignOpen?banner('Owner 已暂停今晚活动。现有奖励仍保留，但不能开始新游戏。',true):'')+
 subSection('CHOOSE YOUR GAME','五款游戏 · 选你喜欢的')+`<div class="grid">${cards}</div>`+
 `<section class="panel"><h3>领取 Staff 给你的 Game Pass</h3><div class="form-grid"><div class="field"><label>八位领取码（本机试玩）</label><input id="claimInput" autocomplete="off" maxlength="32" value="${H(ui.claimValue)}" placeholder="例如：K7B9R2T4"></div><div class="field" style="align-self:end"><button class="button" data-action="claim">领取一局</button></div></div><p class="small">想知道整个流程？先切换 Staff → 生成 Game Pass → 一键模拟顾客领取。</p></section>`+
 (ui.selected?gameStartCard():'');
}
function gameStartCard(){
 const key=ui.selected,g=gameLabels[key];if(!g)return '';
 return `<section class="panel" id="gameReady"><div class="eyebrow">GAME SELECTED</div><h2 style="margin:9px 0">${icon[key]} ${g[0]}</h2><p class="small">开始后会消耗 1 次 Game Pass。画面动画在本机运行，无需等待服务器。奖品为模拟随机结果。</p><div class="toolbar"><button class="button" data-action="start" ${!state.campaignOpen || !state.gameEnabled[key] || unused().length===0 || state.pending?'disabled':''}>使用 1 次机会 · 开始游戏</button><button class="button secondary" data-action="cancel-select">更换游戏</button></div>${!unused().length?banner('没有可用 Game Pass。请切换 Staff 生成一个，或者从 Owner 重置试玩资料。'):''}</section>`;
}
function wallet(){
 const rewards=state.awards.slice().reverse().map(a=>{
 const status=a.redeemed?'已核销':'可试玩核销';return `<article class="item"><div><div class="label">${a.redeemed?'USED REWARD':'MY REWARD · DEMO'}</div><h3>${H(a.name)}</h3><p class="small">来源：${H(a.origin)} · ${fmt(a.created)}</p><span class="tag ${a.redeemed?'off':'ok'}">${status}</span></div>${a.redeemed?'':`<button class="button smallbtn" data-redeem-code="${H(a.id)}">生成 60 秒兑奖码</button>`}</article>`}).join('');
 return `${subSection('MY REWARDS',state.awards.length+' 份试玩奖励')}<div class="stack reward-list">${rewards||'<div class="empty">你还没有奖励。回到 PLAY 玩一局吧！</div>'}</div>`+
 (ui.quickCode?`<section class="panel" id="codeArea"><div class="eyebrow">DYNAMIC REDEEM CODE · DEMO</div><h2>出示给 Staff 核销</h2><p class="small">仅供同一浏览器内模拟；没有真实二维码验证或店内兑换价值。</p><div class="code">${H(ui.quickCode)}</div><p class="small" id="codeCountdown">约 60 秒后失效</p><div class="toolbar"><button class="button" data-action="staff-redeem">切换 Staff 核销此码</button><button class="button secondary" data-action="copy-code">复制代码</button></div></section>`:'');
}
function staff(){
 const pendingCodes=state.issuedCodes.filter(x=>!x.claimed&&x.expires>Date.now());
 return `<div class="stat-grid">${stat('已生成',state.issuedCodes.length)}${stat('待领取',pendingCodes.length)}${stat('已兑奖',state.awards.filter(x=>x.redeemed).length)}${stat('已玩局数',state.plays.length)}</div>`+
 `<section class="panel"><div class="eyebrow">01 · GIVE GAME PASS</div><h2>生成顾客游戏机会</h2><p class="small">试玩版生成可复制的八位领取码。点击代领即可模拟顾客扫码，不需要手机或账号。</p><div class="toolbar"><button class="button" data-action="make-pass">生成 1 次 Game Pass</button><button class="button secondary" data-action="issue-and-claim">一键模拟顾客领取</button></div>`+
 (ui.staffCode?`<div style="margin-top:16px"><div class="eyebrow">JUST GENERATED</div><div class="code">${H(ui.staffCode)}</div><div class="toolbar" style="margin-top:12px"><button class="button secondary" data-action="copy-staff">复制领取码</button><button class="button" data-action="claim-staff-code">领取到顾客账户</button></div></div>`:'')+`</section>`+
 `<section class="panel"><div class="eyebrow">02 · REDEEM REWARD</div><h2>查询与确认核销</h2><p class="small">顾客在 REWARDS 中生成 60 秒代码，再切换 Staff 输入代码。</p><div class="form-grid"><div class="field"><label>兑奖代码</label><input id="redeemLookupInput" value="${H(ui.redeemValue)}" autocomplete="off" placeholder="例如：YT-ABC123"></div><div class="field" style="align-self:end"><button class="button secondary" data-action="lookup">查询奖励</button></div></div>`+
 (ui.lookedUp?`<div class="notice" style="margin-top:16px"><strong>${H(ui.lookedUp.name)}</strong> · 代码已验证<br><button class="button" style="margin-top:12px" data-action="confirm-redeem">确认核销（仅演示）</button></div>`:'')+`</section>`+
 `${subSection('最近的游戏领取码','本机生成记录')}<div class="stack">${state.issuedCodes.slice(-6).reverse().map(x=>`<div class="item"><div><b style="font-family:monospace;letter-spacing:.11em">${H(x.code)}</b><p class="small">${fmt(x.created)} · ${x.claimed?'已领取':x.expires<Date.now()?'已过期':'等待领取'}</p></div>${!x.claimed&&x.expires>Date.now()?`<button class="button smallbtn secondary" data-claim-code="${H(x.code)}">模拟领取</button>`:''}</div>`).join('')||'<div class="empty">尚未生成 Game Pass</div>'}</div>`;
}
function owner(){
 const max=Math.max(1,...state.rewardDefs.map(r=>r.weight));
 return `<div class="stat-grid">${stat('已玩游戏',state.plays.length)}${stat('游戏机会',state.passes.length)}${stat('获得奖励',state.awards.length)}${stat('已核销',state.awards.filter(x=>x.redeemed).length)}</div>`+
 `<section class="panel"><div class="eyebrow">CAMPAIGN CONTROL</div><h2>今晚游戏是否开放</h2><div class="row spread"><span class="tag ${state.campaignOpen?'ok':'off'}">${state.campaignOpen?'OPEN · 开放中':'CLOSED · 暂停中'}</span><button class="button secondary" data-action="toggle-campaign">${state.campaignOpen?'暂停活动':'重新开放'}</button></div><div class="sep"></div><h3>参与游戏</h3><div class="stack">${Object.entries(gameLabels).map(([k,g])=>`<label class="toggle-row"><span>${icon[k]} ${g[0]}</span><span class="checkbox-line"><input type="checkbox" data-enable-game="${k}" ${state.gameEnabled[k]?'checked':''}> ${state.gameEnabled[k]?'ON':'OFF'}</span></label>`).join('')}</div></section>`+
 `<section class="panel"><div class="eyebrow">REWARD ENGINE · DEMO</div><h2>调整中奖奖励与权重</h2><p class="small">不同游戏共用这组模拟抽奖权重，总和无需固定 100；正式版仍由后端控制奖励。</p><div class="owner-weights">${state.rewardDefs.map(x=>`<div class="owner-weight"><label>${H(x.name)}</label><input aria-label="${H(x.name)} 权重" type="number" min="0" max="10000" data-weight="${H(x.id)}" value="${x.weight}"></div>`).join('')}</div><button class="button secondary" data-action="save-weights">保存试玩权重</button><div class="sep"></div><div class="bars">${state.rewardDefs.map(x=>`<div class="bar-row"><span class="small">${H(x.name)}</span><div class="bar-track-mini"><div class="bar-fill" style="width:${x.weight/max*100}%"></div></div><b style="font-size:12px;text-align:right">${x.weight}</b></div>`).join('')}</div></section>`+
 `<section class="panel"><div class="eyebrow">ISSUE REWARD</div><h2>Owner 手动送奖励</h2><div class="form-grid"><div class="field"><label>选择奖励</label><select id="ownerReward">${state.rewardDefs.map(r=>`<option value="${H(r.id)}">${H(r.name)}</option>`).join('')}</select></div><div class="field" style="align-self:end"><button class="button" data-action="owner-issue">送给试玩顾客</button></div></div><div class="sep"></div><h3>新增试玩奖品</h3><div class="form-grid"><div class="field"><label>奖品名称</label><input id="newRewardName" maxlength="65" placeholder="例如：生日特调 ×1"></div><div class="field"><label>奖品权重</label><input id="newRewardWeight" type="number" min="0" max="10000" value="1"></div></div><button class="button secondary" data-action="add-reward" style="margin-top:13px">新增奖品</button></section>`+
 `<section class="panel"><div class="eyebrow">SYSTEM</div><h2>试玩资料管理</h2>${banner('以下按钮只清空此浏览器的试玩资料。不会更改 Supabase、正式奖励或旧 Moon。')}<button class="button danger" data-action="reset" style="margin-top:14px">清空并重置本机试玩</button></section>`;
}
function claim(code){const found=state.issuedCodes.find(x=>x.code===String(code).trim().toUpperCase());if(!found)throw Error('找不到此领取码，请先在 Staff 生成');if(found.claimed)throw Error('这个领取码已经使用');if(found.expires<=Date.now())throw Error('领取码已过期');found.claimed=true;state.passes.push({id:uid(),status:'ready',origin:'STAFF GAME PASS',created:Date.now()});save();ui.claimValue='';ui.staffCode='';toast('Game Pass 已进入顾客账户');return true;}
function issuePass(){const code=newCode();state.issuedCodes.push({id:uid(),code,created:Date.now(),expires:Date.now()+10*60*1000,claimed:false});ui.staffCode=code;save();return code;}
function initiate(game){if(!state.campaignOpen){toast('当前活动已暂停');return}if(state.pending){toast('请先恢复之前尚未完成的游戏');return}const p=unused()[0];if(!p){toast('Game Pass 不足，请先领取机会');return}if(!state.gameEnabled[game]){toast('此游戏暂未开放');return}p.status='used';const r=rewardDraw();state.pending={id:uid(),game,rewardId:r.id,rewardName:r.name,passId:p.id,started:Date.now()};save();runPending();}
function gameHTML(game){return `<div class="eyebrow">${H(gameLabels[game][0])} · DEMO</div><section id="gamePlayStage" class="stage"><div class="stage-icon">${icon[game]}</div><div class="stage-title">READY?</div></section><p class="small" style="text-align:center">游戏过程中不请求服务器 · 随时可恢复未完成的一局</p>`}
function runPending(){cleanup();if(!state.pending)return;ui.role='guest';ui.tab='play';ui.selected=null;render();const holder=$('#content');const section=document.createElement('section');section.className='panel';section.id='playingSection';section.innerHTML=gameHTML(state.pending.game);holder.append(section);section.scrollIntoView({behavior:'smooth',block:'center'});const g=state.pending.game;const token={cancelled:false,id:state.pending.id};runtime=token;
 if(g==='dice')runDice(token);else if(g==='card'||g==='box')runPick(g,token);else if(g==='reaction')runReaction(token);else if(g==='bar')runBar(token);
}
function active(token){return !token.cancelled&&state.pending?.id===token.id}
function display(html){const stage=$('#gamePlayStage');if(stage)stage.innerHTML=html}
function finish(token,extra=''){if(!active(token))return;const p=state.pending;if(!state.awards.some(x=>x.session===p.id)){state.awards.push({id:uid(),session:p.id,rewardId:p.rewardId,name:p.rewardName,origin:gameLabels[p.game][0],created:Date.now(),redeemed:false,redeemCode:null,codeExpiry:0});state.plays.push({id:p.id,game:p.game,finished:Date.now(),result:p.rewardId});}state.pending=null;save();ui.recentReward=p.rewardName;cleanup();display(`<div class="stage-icon">🎉</div><div class="eyebrow">REWARD UNLOCKED</div><div class="reward-reveal"><b>${H(p.rewardName)}</b><p class="small">${H(extra)}<br>奖励已加入你的 Wallet（试玩）</p></div><div class="toolbar"><button class="button" data-action="view-wallet">查看我的奖励</button><button class="button secondary" data-action="back-play">继续选游戏</button></div>`);toast('🎁 '+p.rewardName+' · 已存入试玩钱包');}
function runDice(token){let ticks=0;const dice=[1,2,3,4,5].map(x=>`<span class="die">⚄</span>`).join('');display(`<div class="stage-icon">🥃</div><div class="stage-title">SHAKING…</div><div class="dice shaking">${dice}</div><p class="small">五颗骰子 · 一摇定胜负</p>`);const symbols=['','⚀','⚁','⚂','⚃','⚄','⚅'];rollTimer=setInterval(()=>{if(!active(token)){clearInterval(rollTimer);return}const d=$('.dice');if(d)Array.from(d.children).forEach(x=>x.textContent=symbols[1+Math.floor(Math.random()*6)]);ticks++;if(ticks>=16){clearInterval(rollTimer);const tier=state.pending.rewardId;const count=tier==='rw-special'?5:tier==='rw-milk'?4:tier==='rw-shot'?3:Math.floor(Math.random()*3);const out=Array.from({length:count},()=>1).concat(Array.from({length:5-count},()=>2+Math.floor(Math.random()*5))).sort(()=>Math.random()-.5);display(`<div class="stage-title">摇骰结果</div><div class="dice">${out.map(x=>`<span class="die">${symbols[x]}</span>`).join('')}</div><div class="small">${count} 个 1 · 揭晓奖励中…</div>`);guardTimer=setTimeout(()=>finish(token),800)}},95)}
function runPick(g,token){const isCard=g==='card',symbol=isCard?'🃏':'🎁';display(`<div class="stage-title">${isCard?'PICK A CARD':'CHOOSE YOUR BOX'}</div><p class="small">选一个，看今晚给你什么惊喜</p><div class="picker">${[0,1,2].map(i=>`<button class="pick" data-pick="${i}" aria-label="选择${isCard?'卡片':'礼盒'} ${i+1}">${symbol}</button>`).join('')}</div>`);}
function selectPick(i){const token=runtime;if(!token||!active(token))return;document.querySelectorAll('[data-pick]').forEach(b=>{b.disabled=true;b.style.opacity=Number(b.dataset.pick)===i?'1':'.35'});rollTimer=setTimeout(()=>{if(!active(token))return;display(`<div class="stage-icon">✨</div><div class="stage-title">UNLOCKED</div><div class="small">第 ${i+1} 个选择，正在打开…</div>`);guardTimer=setTimeout(()=>finish(token),500)},500)}
function runReaction(token){display(`<div class="stage-title">REACTION TEST</div><p class="small">等屏幕变绿色，再立即按下！</p><button type="button" class="reaction-pad" id="reactionButton" data-action="reaction-tap">WAIT…</button><div class="small" id="reactionText">准备中…</div>`);token.goAt=null;guardTimer=setTimeout(()=>{if(!active(token))return;const btn=$('#reactionButton');if(!btn)return;token.goAt=performance.now();btn.textContent='TAP!';btn.classList.add('go');$('#reactionText').textContent='NOW!';},1200+Math.random()*2000);rollTimer=setTimeout(()=>{if(active(token))finish(token,'TIME OUT · 反应太慢了')},9000)}
function runBar(token){display(`<div class="stage-title">STOP THE BAR</div><p class="small">对准中央金色区域，按 STOP！</p><div class="bar-track"><div class="bar-target"></div><div class="bar-marker" id="barMarker"></div></div><button class="button" data-action="bar-stop" style="min-width:180px">STOP!</button><div class="small" id="barScore">光标移动中…</div>`);const begin=performance.now();const animate=t=>{if(!active(token))return;const phase=((t-begin)/1150)%2;token.barPosition=phase<1?phase:2-phase;const el=$('#barMarker');if(el)el.style.left=(token.barPosition*100)+'%';frame=requestAnimationFrame(animate)};frame=requestAnimationFrame(animate);guardTimer=setTimeout(()=>{if(active(token))finish(token,'TIME OUT · 自动结束')},10000)}
function walletCode(id){const reward=state.awards.find(x=>x.id===id);if(!reward||reward.redeemed){toast('奖励不存在或已核销');return}reward.redeemCode='YT-'+newCode().slice(0,6);reward.codeExpiry=Date.now()+60000;ui.quickCode=reward.redeemCode;save();render();clearInterval(rollTimer);const update=()=>{const timer=$('#codeCountdown');if(!timer)return clearInterval(rollTimer);const left=Math.max(0,Math.ceil((reward.codeExpiry-Date.now())/1000));timer.textContent=left?`还有 ${left} 秒有效（仅模拟）`:'代码已过期，请重新生成';if(!left)clearInterval(rollTimer);};update();rollTimer=setInterval(update,1000);const t=$('#codeArea');if(t)t.scrollIntoView({behavior:'smooth',block:'center'});}
function lookup(code){const found=state.awards.find(x=>x.redeemCode===String(code).trim().toUpperCase()&&!x.redeemed&&x.codeExpiry>Date.now());if(!found)throw Error('无效 / 已过期 / 已使用的兑奖码');ui.lookedUp={id:found.id,name:found.name,code:found.redeemCode};render();}
async function clip(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch{toast('无法自动复制，请长按代码手动复制')}}
function clickAction(act,el){
 try{
 switch(act){
 case 'start':initiate(ui.selected);break;
 case 'cancel-select':ui.selected=null;render();break;
 case 'view-wallet':cleanup();ui.tab='wallet';ui.quickCode=null;render();break;
 case 'back-play':cleanup();ui.tab='play';render();break;
 case 'resume':runPending();break;
 case 'claim':claim($('#claimInput').value);ui.claimValue='';render();break;
 case 'make-pass':issuePass();render();toast('已生成 Game Pass');break;
 case 'issue-and-claim':claim(issuePass());role('guest');break;
 case 'claim-staff-code':claim(ui.staffCode);role('guest');break;
 case 'copy-staff':clip(ui.staffCode);break;
 case 'copy-code':clip(ui.quickCode);break;
 case 'staff-redeem':ui.redeemValue=ui.quickCode;role('staff');break;
 case 'lookup':ui.redeemValue=$('#redeemLookupInput').value;lookup(ui.redeemValue);break;
 case 'confirm-redeem':{
 const a=state.awards.find(x=>x.id===ui.lookedUp?.id&&x.redeemCode===ui.lookedUp.code);
 if(!a||a.redeemed||a.codeExpiry<=Date.now())throw Error('兑奖码已过期或被使用');a.redeemed=true;a.redeemedAt=Date.now();save();ui.lookedUp=null;ui.redeemValue='';ui.quickCode=null;render();toast('核销成功 · 仅试玩，不是真实奖励');break;}
 case 'toggle-campaign':state.campaignOpen=!state.campaignOpen;save();render();toast(state.campaignOpen?'活动开放':'活动已暂停');break;
 case 'save-weights':{const inputs=[...document.querySelectorAll('[data-weight]')];for(const input of inputs){const value=Number(input.value);if(!Number.isInteger(value)||value<0||value>10000)throw Error('权重须为 0–10000 的整数');}for(const input of inputs){state.rewardDefs.find(x=>x.id===input.dataset.weight).weight=Number(input.value)}if(inputs.every(input=>Number(input.value)===0))throw Error('至少有一款奖品权重大于 0');save();render();toast('试玩奖池已保存');break;}
 case 'owner-issue':{const reward=state.rewardDefs.find(x=>x.id===$('#ownerReward').value);if(!reward)throw Error('找不到奖品');state.awards.push({id:uid(),rewardId:reward.id,name:reward.name,origin:'OWNER GIFT',created:Date.now(),redeemed:false,redeemCode:null,codeExpiry:0});save();render();toast('已送给试玩顾客的 Wallet');break;}
 case 'add-reward':{const name=$('#newRewardName').value.trim(),weight=Number($('#newRewardWeight').value);if(!name||name.length>65||!Number.isInteger(weight)||weight<0||weight>10000)throw Error('请输入名称及有效权重');state.rewardDefs.push({id:uid(),name,weight});save();render();toast('奖品已新增');break;}
 case 'reset':{if(!confirm('确定清空此浏览器的所有试玩资料？这不会触碰正式系统。'))return;cleanup();state=defaultState();ui={role:'guest',tab:'play',selected:null,staffCode:'',claimValue:'',redeemValue:'',lookedUp:null,recentReward:null,quickCode:null};save();render();toast('本机试玩已重置');break;}
 case 'reaction-tap':{const t=runtime;if(!t||!active(t))return;const score=t.goAt===null?'FALSE START · 抢跑':Math.round(performance.now()-t.goAt)+' ms';clearTimeout(guardTimer);clearTimeout(rollTimer);display(`<div class="stage-icon">⚡</div><div class="stage-title">${H(score)}</div><p class="small">成绩仅供娱乐，奖品随机</p>`);guardTimer=setTimeout(()=>finish(t,score),850);break;}
 case 'bar-stop':{const t=runtime;if(!t||!active(t))return;cancelAnimationFrame(frame);clearTimeout(guardTimer);const score=Math.round(Math.max(0,1-Math.abs((t.barPosition||0)-.5)*2)*100);display(`<div class="stage-icon">🎯</div><div class="stage-title">ACCURACY ${score}%</div><p class="small">成绩仅供娱乐，奖品随机</p>`);guardTimer=setTimeout(()=>finish(t,'ACCURACY '+score+'%'),850);break;}
 }
 }catch(err){toast(err.message||'发生错误')}
}
 document.addEventListener('click',e=>{const r=e.target.closest('[data-role]');if(r){role(r.dataset.role);return}const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}const pick=e.target.closest('[data-pick]');if(pick){selectPick(Number(pick.dataset.pick));return}const game=e.target.closest('[data-select-game]');if(game){ui.selected=game.dataset.selectGame;render();$('#gameReady')?.scrollIntoView({behavior:'smooth',block:'center'});return}const redeem=e.target.closest('[data-redeem-code]');if(redeem){walletCode(redeem.dataset.redeemCode);return}const claimButton=e.target.closest('[data-claim-code]');if(claimButton){try{claim(claimButton.dataset.claimCode);role('guest')}catch(err){toast(err.message)}return}const action=e.target.closest('[data-action]');if(action){clickAction(action.dataset.action,action)} });
 document.addEventListener('change',e=>{if(e.target.matches('[data-enable-game]')){state.gameEnabled[e.target.dataset.enableGame]=e.target.checked;save();render();toast('游戏开关已保存')}});
 document.addEventListener('input',e=>{if(e.target.id==='claimInput')ui.claimValue=e.target.value; if(e.target.id==='redeemLookupInput')ui.redeemValue=e.target.value;});
 save();render();
})();
</script>
</body>
</html>
